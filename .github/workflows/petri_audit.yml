name: Petri Audit (medlang-circuits)

# PatientWords multi-turn register experiments executed through the Petri
# harness (docs/petri_integration_design.md). PAID when mode is `run`: the
# target model and the optional judge spend provider tokens under max_spend
# and judge_max_spend; `preflight` validates seeds, verifies the exact
# environment lock, prices the run and bounds it, and calls nothing;
# `dry_run` executes the whole pipeline against mockllm at $0.
#
# `readapt` (2026-09-24; scripts/petri_audit/readapt.py) recovers a paid run
# whose target calls completed but whose adaptation failed: it makes NO target
# call, downloads the raw .eval that run uploaded (`source_run_id` names the
# workflow run), adapts it under the current sanitiser into that run's own
# directory beside the target cost sidecar that already booked its spend, and
# runs the judge of record as `run` does. Paid (the judge); its commitment is
# judge_max_spend alone, and fire_trigger.py and the budget gate below refuse
# it unless its parameters are the ones the source fire ran under.
#
# `rejudge` (2026-09-24; scripts/petri_audit/rejudge.py; exploratory, owner-approved) re-grades landed runs
# (`source_runs`: run stems under data/petri/runs) with a judge other than their judge of record. It runs in its
# own job below: no target call, no adaptation, nothing under data/petri/runs written. It plans exactly the
# judgments the judge of record made, from the committed transcripts, refuses unless the plan matches that judge's
# rows digest for digest, and writes data/petri/rejudge/<judge slug>/<stem>/. Paid (the judge); its commitment is
# judge_max_spend alone, on the judge's channel. `judge_model: mockllm/judge` is the free rehearsal: the whole job
# at $0, uploaded as an artifact and never committed; the job's steps read it from the params job's exact `rehearsal`
# output. A later source run's abort does not discard an earlier one's completed re-grade: verification, upload and
# the commit run whenever the plan succeeded, over exactly the re-grades that wrote their manifest.
#
# The raw Inspect .eval log is NEVER committed: it is written outside the
# checkout, uploaded as a workflow artifact with 90-day retention, and bound
# to the committed manifest by sha256. Only the sanitised allowlist
# projection, the transcripts, the rule outcomes, the judgments and the
# manifest enter the repository.
#
# Start it from the Actions tab (workflow_dispatch) or by pushing a params file
# to .github/trigger/petri-audit.json via scripts/fire_trigger.py ONLY. The
# trigger file is created by `fire_trigger.py park --trigger petri-audit`
# after this workflow lands, never by hand; until it exists, no push fires
# this lane. Owner rule (2026-09-16): no fire of any mode until the owner
# authorises the first execution explicitly.

on:
  workflow_dispatch:
    inputs:
      seeds_file:
        description: "Seed file (docs/framework/petri_seeds.draft.json or a successor)"
        type: string
        default: "docs/framework/petri_seeds.draft.json"
      seed_ids:
        description: "Space-separated seed ids to run (empty = every seed of the wave)"
        type: string
        default: ""
      wave:
        description: "Pilot wave to select when seed_ids is empty (1 = the first end-to-end pilot)"
        type: string
        default: "1"
      target:
        description: "Inspect target model string, e.g. anthropic/claude-haiku-4-5 (mockllm/model under dry_run)"
        type: string
        default: "mockllm/model"
      auditor_model:
        description: "Adaptive auditor model string for autonomous seeds (docs/petri_adaptive_design.md); empty for scripted seeds; mockllm/model under dry_run"
        type: string
        default: ""
      mode:
        description: "preflight (no calls), dry_run (mockllm, $0), run (paid), readapt (judge paid; push-to-run fires only), rejudge (judge paid; mockllm/judge rehearsal $0)"
        type: string
        default: "preflight"
      epochs:
        description: "Repeats per condition (the pilot's provisional R)"
        type: string
        default: "1"
      token_limit:
        description: "Per-sample token limit passed to Inspect (input + output)"
        type: string
        default: "20000"
      max_spend:
        description: "HARD spend ceiling in USD for the target calls (required, counted by the guard)"
        type: string
        default: "0.01"
      judge:
        description: "Also run the judge of record over the exported records (paid)"
        type: boolean
        default: false
      judge_model:
        description: "Judge model spec (registry: bare Anthropic id or provider:model)"
        type: string
        default: "claude-haiku-4-5"
      judge_max_spend:
        description: "HARD judge spend ceiling in USD"
        type: string
        default: "0.01"
      judge_max_tokens:
        description: "Max output tokens per judge call"
        type: string
        default: "300"
      log_model_api:
        description: "Keep every raw provider request and response in the (unpublished) .eval"
        type: boolean
        default: true
      commit_outputs:
        description: "Commit the sanitised exports, transcripts, judgments and manifest back to the branch (mode run or readapt)"
        type: boolean
        default: false
      source_run_id:
        description: "Mode readapt only: the workflow run id whose raw-eval artifact is re-adapted (empty otherwise)"
        type: string
        default: ""
      source_runs:
        description: "Mode rejudge only: space-separated landed run stems under data/petri/runs to re-grade (empty otherwise)"
        type: string
        default: ""
  push:
    paths:
      - ".github/trigger/petri-audit.json"

permissions:
  contents: write
  actions: read

concurrency:
  group: petri-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  params:
    # A push that creates a ref carries created:true, and on a new ref every
    # trigger file counts as changed. Skip on creation; fires are pushes to
    # existing branches.
    if: ${{ !github.event.created }}
    runs-on: ubuntu-latest
    outputs:
      seeds_file: ${{ steps.params.outputs.seeds_file }}
      seed_ids: ${{ steps.params.outputs.seed_ids }}
      wave: ${{ steps.params.outputs.wave }}
      target: ${{ steps.params.outputs.target }}
      auditor_model: ${{ steps.params.outputs.auditor_model }}
      mode: ${{ steps.params.outputs.mode }}
      epochs: ${{ steps.params.outputs.epochs }}
      token_limit: ${{ steps.params.outputs.token_limit }}
      max_spend: ${{ steps.params.outputs.max_spend }}
      judge: ${{ steps.params.outputs.judge }}
      judge_model: ${{ steps.params.outputs.judge_model }}
      judge_max_spend: ${{ steps.params.outputs.judge_max_spend }}
      judge_max_tokens: ${{ steps.params.outputs.judge_max_tokens }}
      log_model_api: ${{ steps.params.outputs.log_model_api }}
      commit_outputs: ${{ steps.params.outputs.commit_outputs }}
      source_run_id: ${{ steps.params.outputs.source_run_id }}
      source_runs: ${{ steps.params.outputs.source_runs }}
      # mode rejudge's rehearsal, decided by an exact comparison in the heredoc: the rejudge job's steps gate on this
      # "true"/"false" rather than on judge_model, which GitHub's expression != compares ignoring case (PR #41 review)
      rehearsal: ${{ steps.params.outputs.rehearsal }}
      # the fire's `_nonce` (pass-through metadata, never a trigger key): the run records it so its cost sidecar can be
      # reconciled with the journal entry that reserved the spend (PR B, 2026-09-18)
      _nonce: ${{ steps.params.outputs._nonce }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          filter: blob:none
          # the daily-ceiling gate reads the journal at github.event.before to tell a fire from a replay of one,
          # and a depth-1 clone has no commit to read it at; blobless keeps full history cheap
          fetch-depth: 0
          sparse-checkout: |
            .github
            scripts
            data
            medlang_circuits
            docs
            ops
            tests
      - name: Resolve parameters
        id: params
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          IN_SEEDS_FILE: ${{ inputs.seeds_file }}
          IN_SEED_IDS: ${{ inputs.seed_ids }}
          IN_WAVE: ${{ inputs.wave }}
          IN_TARGET: ${{ inputs.target }}
          IN_AUDITOR_MODEL: ${{ inputs.auditor_model }}
          IN_MODE: ${{ inputs.mode }}
          IN_EPOCHS: ${{ inputs.epochs }}
          IN_TOKEN_LIMIT: ${{ inputs.token_limit }}
          IN_MAX_SPEND: ${{ inputs.max_spend }}
          IN_JUDGE: ${{ inputs.judge }}
          IN_JUDGE_MODEL: ${{ inputs.judge_model }}
          IN_JUDGE_MAX_SPEND: ${{ inputs.judge_max_spend }}
          IN_JUDGE_MAX_TOKENS: ${{ inputs.judge_max_tokens }}
          IN_LOG_MODEL_API: ${{ inputs.log_model_api }}
          IN_COMMIT_OUTPUTS: ${{ inputs.commit_outputs }}
          IN_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          IN_SOURCE_RUNS: ${{ inputs.source_runs }}
        run: |
          python - <<'EOF'
          import json, os, re
          # The push-path defaults dict MUST contain every trigger key (unknown
          # keys in the trigger file are silently ignored by design; the fire
          # guard's KNOWN_KEYS mirrors this set).
          defaults = {"seeds_file": "docs/framework/petri_seeds.draft.json",
                      "seed_ids": "",
                      "wave": "1",
                      "target": "mockllm/model",
                      "auditor_model": "",
                      "mode": "preflight",
                      "epochs": "1",
                      "token_limit": "20000",
                      "max_spend": "0.01",
                      "judge": "false",
                      "judge_model": "claude-haiku-4-5",
                      "judge_max_spend": "0.01",
                      "judge_max_tokens": "300",
                      "log_model_api": "true",
                      "commit_outputs": "false",
                      "source_run_id": "",
                      "source_runs": ""}
          p = dict(defaults)
          nonce = ""                        # the fire's _nonce, metadata beside the trigger keys (empty on dispatch)
          if os.environ["EVENT_NAME"] == "push":
              with open(".github/trigger/petri-audit.json", encoding="utf-8") as f:
                  cfg = json.load(f)
              nonce = str(cfg.get("_nonce") or "")
              for k in ("seed_ids", "source_runs"):
                  if isinstance(cfg.get(k), list):
                      cfg[k] = " ".join(str(s) for s in cfg[k])
              p.update({k: (str(v).lower() if isinstance(v, bool) else str(v))
                        for k, v in cfg.items() if k in defaults})
          else:
              for k in defaults:
                  v = os.environ.get("IN_" + k.upper(), "")
                  if v:
                      p[k] = v
          if p["mode"] not in ("preflight", "dry_run", "run", "readapt", "rejudge"):
              raise SystemExit("mode must be preflight, dry_run, run, readapt or rejudge")
          if p["mode"] == "dry_run" and p["target"] != "mockllm/model":
              raise SystemExit("dry_run runs against mockllm/model only")
          # every mock/test sentinel, not just the one dry_run uses: `mockllm/judge` and `none/none` price at
          # zero in the engine's table, so naming one as a run target passed the paid pre-flight bound for free
          # and could commit mock output through the production path (Codex round 5); a readapt states the
          # target its source run called, which was never a sentinel
          if p["mode"] in ("run", "readapt") and p["target"].split("/")[0] in ("mockllm", "none"):
              raise SystemExit(f"mode {p['mode']} needs a real target, not the test sentinel {p['target']!r}; "
                               "use dry_run for mockllm")
          # every target that is not openrouter/ is booked to the Anthropic lane (fire_trigger.petri_channels), but the
          # run step also exports the direct OpenAI and Gemini keys, so openai/... or google/... would bill a vendor key
          # against the Anthropic ceiling; cli preflight refuses the same spellings (spend.target_provider_problems).
          # A readapt calls no target, but it states its source run's target, which the preflight step below prices
          # and refuses in every mode, after the fire has reserved the judge's ceiling; so the paid-target rules here
          # hold for it too and the fire guard refuses the same spellings (fire_trigger.petri_target_problems)
          if (p["mode"] in ("run", "readapt") and "/" in p["target"]
                  and p["target"].split("/")[0] not in ("anthropic", "openrouter")):
              raise SystemExit(f"mode {p['mode']} books every target that is not openrouter/ to the Anthropic lane, "
                               f"but {p['target']!r} bills its own vendor key; route it through OpenRouter as "
                               "openrouter/<vendor>/<model> (for example openrouter/openai/gpt-5.4-mini)")
          # the test above runs only on a spelling with a slash, so a bare model name (which cli preflight reads as
          # Anthropic), an empty target, a provider with no model and OpenRouter with no vendor all passed it into
          # the paid steps (Codex review of PR #37, 2026-09-23). A paid target names its provider and model exactly;
          # preflight and dry_run keep their mock targets (the checks above)
          if (p["mode"] in ("run", "readapt")
                  and not re.fullmatch(r"anthropic/[^/\s]+|openrouter/[^/\s]+/[^/\s]+", p["target"])):
              raise SystemExit(f"mode {p['mode']} needs a target spelled anthropic/<model> or "
                               f"openrouter/<vendor>/<model>, got {p['target']!r}; a bare model name names no provider")
          # the adaptive auditor (docs/petri_adaptive_design.md) is billed and booked as the target is: the same
          # spelling rules in mode run, the target's channel (one fire carries one commitment on one account), the
          # mock under dry_run, and nothing in the modes that run no target. cli preflight refuses an autonomous seed
          # without an auditor and a scripted seed with one, so the seed file decides whether it is read
          if p["auditor_model"]:
              if p["mode"] not in ("preflight", "dry_run", "run"):
                  raise SystemExit(f"auditor_model is read by preflight, dry_run and run only, got mode {p['mode']!r}")
              if p["mode"] == "dry_run" and p["auditor_model"] != "mockllm/model":
                  raise SystemExit("dry_run runs its auditor against mockllm/model only")
              if p["mode"] == "run" and not re.fullmatch(r"anthropic/[^/\s]+|openrouter/[^/\s]+/[^/\s]+",
                                                         p["auditor_model"]):
                  raise SystemExit(f"mode run needs an auditor spelled anthropic/<model> or openrouter/<vendor>/<model>, "
                                   f"got {p['auditor_model']!r}")
              if p["mode"] == "run" and (p["auditor_model"].startswith("openrouter/")
                                         != p["target"].startswith("openrouter/")):
                  raise SystemExit(f"auditor {p['auditor_model']!r} and target {p['target']!r} bill different channels; "
                                   "one fire carries one commitment on one account")
          # a paid run is admitted only from a push-to-run fire on its first attempt: the fire path journals the
          # reservation the daily ceiling counts, and neither a workflow_dispatch nor an Actions-tab re-run has one
          # of its own (Codex round 8); preflight and dry_run cost nothing and may run from anywhere. A readapt is
          # paid too (its judge), so the same holds for it
          if p["mode"] in ("run", "readapt") and os.environ["EVENT_NAME"] != "push":
              raise SystemExit(f"mode {p['mode']} is fired through scripts/fire_trigger.py only (its journal entry is "
                               "the reservation the daily ceiling counts); a workflow_dispatch may run preflight or dry_run")
          if p["mode"] in ("run", "readapt") and os.environ.get("RUN_ATTEMPT", "1") != "1":
              raise SystemExit(f"mode {p['mode']} cannot be re-run from the Actions tab (attempt "
                               f"{os.environ.get('RUN_ATTEMPT')} has no reservation of its own); re-fire through "
                               "scripts/fire_trigger.py")
          float(p["max_spend"]); float(p["judge_max_spend"]); int(p["epochs"]); int(p["token_limit"])
          # the judge's token allowance is parsed here too (Codex round 6): a bad value used to fail only in the
          # judge step's argparse, after every target call had spent and the judge_started marker was set
          if int(p["judge_max_tokens"]) <= 0:
              raise SystemExit(f"judge_max_tokens must be a positive integer, got {p['judge_max_tokens']!r}")
          # boolean keys are compared against "true" exactly downstream, so every spelling other than true/false
          # (a typo, "yes", "True") is refused here rather than silently read as false after a paid step
          for k in ("judge", "log_model_api", "commit_outputs"):
              v = p[k].strip().lower()
              if v not in ("true", "false"):
                  raise SystemExit(f"{k} must be true or false, got {p[k]!r}")
              p[k] = v
          # mode readapt re-adapts one named run's raw log and runs the judge of record over it; the judge is its only
          # spend (fire_trigger.py commits judge_max_spend alone), so a readapt without one is refused, and the run id
          # is ASCII digits only (it becomes the run directory and the artifact name). Any other mode ignores
          # source_run_id, so a value there is refused rather than carried
          if p["mode"] == "readapt":
              if not (p["source_run_id"].isascii() and p["source_run_id"].isdigit()):
                  raise SystemExit(f"mode readapt needs source_run_id, the numeric workflow run id whose raw-eval "
                                   f"artifact it re-adapts, got {p['source_run_id']!r}")
              if p["judge"] != "true":
                  raise SystemExit("mode readapt runs the judge of record (judge true): the judge is its only spend")
          elif p["source_run_id"]:
              raise SystemExit(f"source_run_id is read by mode readapt only, got {p['source_run_id']!r} with mode "
                               f"{p['mode']!r}")
          # mode rejudge re-grades landed runs with another judge (scripts/petri_audit/rejudge.py): no target call,
          # so the target and max_spend are not read. It names one or more run stems, none twice, runs the judge, and
          # carries the judge spec exactly: `mockllm/judge` is the free rehearsal, recognised by exact match, which is
          # never committed and may run from a dispatch; any other judge is paid and admitted from a push-to-run fire
          # on its first attempt only, as run and readapt are. Any other mode ignores source_runs, so a value there is
          # refused rather than carried
          if p["mode"] == "rejudge":
              stems = p["source_runs"].split()
              if not stems or any(not re.fullmatch(r"run_[0-9]+_[0-9]+", t) for t in stems) or len(set(stems)) != len(stems):
                  raise SystemExit(f"mode rejudge needs source_runs, one or more distinct run stems "
                                   f"(run_<workflow run id>_<attempt>), got {p['source_runs']!r}")
              if p["judge"] != "true":
                  raise SystemExit("mode rejudge runs a judge (judge true): the judge is its only work and its only spend")
              if not p["judge_model"] or p["judge_model"] != p["judge_model"].strip():
                  raise SystemExit(f"mode rejudge needs judge_model spelled exactly, got {p['judge_model']!r}")
              # a zero-price sentinel in another case would be the rehearsal to an expression `!=` (which ignores
              # case) and a paid judge to every Python check; no judge is spelled so, so it is refused
              if (p["judge_model"].lower() in ("mockllm/judge", "mockllm/model", "none/none")
                      and p["judge_model"] not in ("mockllm/judge", "mockllm/model", "none/none")):
                  raise SystemExit(f"mode rejudge judge_model {p['judge_model']!r} differs from a test sentinel in case "
                                   "alone; the workflow compares it ignoring case, so it is refused")
              if p["judge_model"] == "mockllm/judge":
                  if p["commit_outputs"] == "true":
                      raise SystemExit("mode rejudge with the rehearsal judge mockllm/judge is never committed; it needs "
                                       "commit_outputs false")
              elif os.environ["EVENT_NAME"] != "push":
                  raise SystemExit("a paid rejudge is fired through scripts/fire_trigger.py only (its journal entry is the "
                                   "reservation the daily ceiling counts); a workflow_dispatch may run the mockllm/judge "
                                   "rehearsal")
              elif os.environ.get("RUN_ATTEMPT", "1") != "1":
                  raise SystemExit(f"a paid rejudge cannot be re-run from the Actions tab (attempt "
                                   f"{os.environ.get('RUN_ATTEMPT')} has no reservation of its own); re-fire through "
                                   "scripts/fire_trigger.py")
          elif p["source_runs"]:
              raise SystemExit(f"source_runs is read by mode rejudge only, got {p['source_runs']!r} with mode "
                               f"{p['mode']!r}")
          # Every value below is written as one `key=value` line, and a later duplicate key wins, so a value
          # carrying a newline writes further key=value lines of its own: a trigger file whose `target` or
          # `_nonce` held one could rewrite mode, a ceiling or commit_outputs AFTER the checks above passed.
          # `_nonce` is written last, so an injected line there overrides every key. fire_trigger.py refuses
          # such a value at the fire, and this refuses it again for a trigger file no fire wrote (PR B).
          for k, v in list(p.items()) + [("_nonce", nonce)]:
              if any(ord(c) < 32 or ord(c) == 127 for c in v):
                  raise SystemExit(f"{k} must not carry a control character (newline, carriage return, tab), got {v!r}")
          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a", encoding="utf-8") as f:
              for k in defaults:
                  f.write(k + "=" + p[k] + "\n")
              f.write("rehearsal=" + ("true" if p["mode"] == "rejudge" and p["judge_model"] == "mockllm/judge"
                                      else "false") + "\n")
              f.write("_nonce=" + nonce + "\n")
          print(" | ".join(f"{k}={p[k]}" for k in sorted(defaults)))
          EOF

      - name: Daily-ceiling gate (server-side; same budget_check as the fire guard)
        env:
          GATE_PARAMS: ${{ toJSON(steps.params.outputs) }}
          # the ref's tip BEFORE this push. fire_trigger writes the journal entry and the trigger file in one
          # commit, so a reservation already present at that commit was taken by an earlier fire and this push is
          # a replay of it - which identical bytes restored by a merge otherwise pass (Codex round 10 on PR #28)
          PUSH_BEFORE: ${{ github.event.before }}
          # the ref this run is on. A reservation is for one ref as well as one push: the same fire commit
          # reaching a second branch by merge or cherry-pick appears there for the first time, so the push
          # binding alone would read it as a fresh reservation (Codex round 11 on PR #28)
          REF_NAME: ${{ github.ref_name }}
        run: |
          printf '%s' "$GATE_PARAMS" > "$RUNNER_TEMP/gate_params.json"
          python3 scripts/fire_trigger.py budget-gate --trigger petri-audit --params-file "$RUNNER_TEMP/gate_params.json" --push-before "$PUSH_BEFORE" --ref "$REF_NAME"

  audit:
    # every mode but rejudge, which has its own job below (it calls no target and adapts nothing)
    if: ${{ !github.event.created && needs.params.outputs.mode != 'rejudge' }}
    needs: params
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      # The run directory every step writes and reads. Each attempt of a run or dry run gets its own (Codex round
      # 7: a re-run keeps github.run_id). A readapt writes into the SOURCE run's directory, beside the target cost
      # sidecar that booked its spend; mode run refuses re-runs (the params job refuses a whole-run re-run, and the
      # Run step a re-run of this job alone), so a paid run's only directory is attempt 1's.
      RUN_STEM: ${{ needs.params.outputs.mode == 'readapt' && format('run_{0}_1', needs.params.outputs.source_run_id) || format('run_{0}_{1}', github.run_id, github.run_attempt) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          filter: blob:none
          sparse-checkout: |
            .github
            scripts
            data
            medlang_circuits
            docs
            ops
            tests
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # the exact interpreter the environment lock records; verify-lock refuses any other
          python-version: "3.12.3"

      - name: Install the locked environment (exact versions from docs/framework/petri_environment.lock.json)
        run: |
          python - <<'EOF'
          import json
          lock = json.load(open("docs/framework/petri_environment.lock.json", encoding="utf-8"))
          with open("petri-lock-requirements.txt", "w", encoding="utf-8") as f:
              for name, version in sorted(lock["packages"].items()):
                  f.write(f"{name}=={version}\n")
          with open("petri-harness-commit.txt", "w", encoding="utf-8") as f:
              f.write(lock["harness"]["commit"])
          EOF
          pip install --quiet -r petri-lock-requirements.txt
          pip install --quiet --no-deps "inspect_petri @ git+https://github.com/michaeldgreenphd/patientwords-inspect_petri@$(cat petri-harness-commit.txt)"
          pip install --quiet -e ".[llm]" pyyaml
          rm -f petri-lock-requirements.txt petri-harness-commit.txt

      - name: Verify the environment lock (refuses any drift before a model call)
        run: python -m scripts.petri_audit.cli verify-lock

      - name: Validate seeds
        env:
          SEEDS_FILE: ${{ needs.params.outputs.seeds_file }}
          SEED_IDS: ${{ needs.params.outputs.seed_ids }}
          WAVE: ${{ needs.params.outputs.wave }}
        run: |
          ARGS=""
          for s in $SEED_IDS; do ARGS="$ARGS --seed-id $s"; done
          if [ -z "$SEED_IDS" ]; then ARGS="--wave $WAVE"; fi
          python -m scripts.petri_audit.cli validate-seeds --seeds "$SEEDS_FILE" $ARGS

      - name: Preflight (prices, bound, lock; no model call)
        env:
          SEEDS_FILE: ${{ needs.params.outputs.seeds_file }}
          SEED_IDS: ${{ needs.params.outputs.seed_ids }}
          WAVE: ${{ needs.params.outputs.wave }}
          TARGET: ${{ needs.params.outputs.target }}
          AUDITOR_MODEL: ${{ needs.params.outputs.auditor_model }}
          MAX_SPEND: ${{ needs.params.outputs.max_spend }}
          JUDGE: ${{ needs.params.outputs.judge }}
          JUDGE_MODEL: ${{ needs.params.outputs.judge_model }}
          JUDGE_MAX_SPEND: ${{ needs.params.outputs.judge_max_spend }}
          EPOCHS: ${{ needs.params.outputs.epochs }}
          TOKEN_LIMIT: ${{ needs.params.outputs.token_limit }}
        run: |
          ARGS=""
          for s in $SEED_IDS; do ARGS="$ARGS --seed-id $s"; done
          if [ -z "$SEED_IDS" ]; then ARGS="--wave $WAVE"; fi
          if [ "$JUDGE" = "true" ]; then ARGS="$ARGS --judge-max-spend $JUDGE_MAX_SPEND --judge-model $JUDGE_MODEL"; fi
          if [ -n "$AUDITOR_MODEL" ]; then ARGS="$ARGS --auditor-model $AUDITOR_MODEL"; fi
          python -m scripts.petri_audit.cli preflight --seeds "$SEEDS_FILE" $ARGS \
            --target "$TARGET" --max-spend "$MAX_SPEND" --epochs "$EPOCHS" --token-limit "$TOKEN_LIMIT"

      # Mode readapt, before anything is downloaded: the source run's artifacts are listed through the REST API and
      # `readapt-plan` refuses by name an artifact that is missing, ambiguous, expired or listed under another run,
      # a source directory that holds anything but its landed target sidecar (a landed run is never rewritten), and
      # a sidecar or journal entry that does not identify the source fire. It writes the plan the adapt step reads.
      # No model call. The listing needs `actions: read` (the workflow's permissions grant it).
      - name: Plan the readapt (mode readapt; locate the source run's raw-eval artifact; no model call)
        if: ${{ needs.params.outputs.mode == 'readapt' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ needs.params.outputs.source_run_id }}
          RESOLVED_PARAMS: ${{ toJSON(needs.params.outputs) }}
        run: |
          mkdir -p "$RUNNER_TEMP/petri-readapt" "$RUNNER_TEMP/petri-run/logs"
          printf '%s' "$RESOLVED_PARAMS" > "$RUNNER_TEMP/petri-readapt/params.json"
          if ! gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" \
              > "$RUNNER_TEMP/petri-readapt/artifacts.json"; then
            echo "readapt refused: the artifact listing of workflow run $SOURCE_RUN_ID could not be read (no such run in this repository, or the token lacks actions: read)" >&2
            exit 1
          fi
          python -m scripts.petri_audit.cli readapt-plan --params-file "$RUNNER_TEMP/petri-readapt/params.json" \
            --listing "$RUNNER_TEMP/petri-readapt/artifacts.json" --runs-dir data/petri/runs \
            --readapt-run-id "$GITHUB_RUN_ID" --readapt-run-attempt "$GITHUB_RUN_ATTEMPT" --readapt-commit "$GITHUB_SHA" \
            --out "$RUNNER_TEMP/petri-readapt/plan.json"

      # The source run's raw log, into the directory the run step would have written it to, so every later step
      # (the raw-log refusal, the re-upload below under this run's own id, the summary) reads it where it always
      # does. Outside the checkout; never committed. The adapt step checks it is the file the landed sidecar priced.
      - name: Download the source run's raw .eval (mode readapt; outside the checkout)
        if: ${{ needs.params.outputs.mode == 'readapt' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: petri-audit-raw-eval-${{ needs.params.outputs.source_run_id }}-1
          run-id: ${{ needs.params.outputs.source_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/petri-run/logs

      - name: Run (mode dry_run or run; the raw .eval is written OUTSIDE the checkout)
        if: ${{ needs.params.outputs.mode == 'dry_run' || needs.params.outputs.mode == 'run' }}
        env:
          MODE: ${{ needs.params.outputs.mode }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          JOURNAL_NONCE: ${{ needs.params.outputs._nonce }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SEEDS_FILE: ${{ needs.params.outputs.seeds_file }}
          SEED_IDS: ${{ needs.params.outputs.seed_ids }}
          WAVE: ${{ needs.params.outputs.wave }}
          TARGET: ${{ needs.params.outputs.target }}
          AUDITOR_MODEL: ${{ needs.params.outputs.auditor_model }}
          MAX_SPEND: ${{ needs.params.outputs.max_spend }}
          JUDGE: ${{ needs.params.outputs.judge }}
          JUDGE_MODEL: ${{ needs.params.outputs.judge_model }}
          JUDGE_MAX_SPEND: ${{ needs.params.outputs.judge_max_spend }}
          EPOCHS: ${{ needs.params.outputs.epochs }}
          TOKEN_LIMIT: ${{ needs.params.outputs.token_limit }}
          LOG_MODEL_API: ${{ needs.params.outputs.log_model_api }}
        run: |
          # A paid run on its first attempt only, checked HERE as well as in the params job. "Re-run failed jobs"
          # and "Re-run this job" re-run this job alone, at the next github.run_attempt, and reuse the params job's
          # outputs, so the params job's attempt refusal and the budget gate never run for the re-run: it would call
          # the target again into run_<id>_2 with no journal reservation of its own (w2e3's failed run 35937014168
          # was one click from spending ~$0.93 again). Refused before the marker, so the always()-gated spend report
          # imputes nothing for it. A dry run costs nothing and may re-run; a readapt never reaches this step, and
          # its plan step refuses any attempt but the first (scripts/petri_audit/readapt.py).
          if [ "$MODE" = "run" ] && [ "$RUN_ATTEMPT" != "1" ]; then
            echo "mode run cannot be re-run from the Actions tab (attempt ${RUN_ATTEMPT:-unknown}): a re-run of this job skips the params job's attempt check and the budget gate and has no journal reservation of its own; re-fire through scripts/fire_trigger.py" >&2
            exit 1
          fi
          ARGS=""
          for s in $SEED_IDS; do ARGS="$ARGS --seed-id $s"; done
          if [ -z "$SEED_IDS" ]; then ARGS="--wave $WAVE"; fi
          if [ "$JUDGE" = "true" ]; then ARGS="$ARGS --judge-max-spend $JUDGE_MAX_SPEND --judge-model $JUDGE_MODEL"; fi
          if [ -n "$AUDITOR_MODEL" ]; then ARGS="$ARGS --auditor-model $AUDITOR_MODEL"; fi
          # The target-start marker, the twin of the judge's, marks the point from which a provider call can spend.
          # The always()-gated spend report runs even when a step BEFORE the call failed - seed validation, the
          # environment lock, preflight - and with no eval log it imputes the FULL target ceiling; since PR B binds
          # the journal nonce into that sidecar, the ledger would fold a cost for a run that made no provider call
          # (Codex round 8 on PR #28). `cli run` writes it (--started-marker) after the target model is built and
          # priced, immediately before the eval: touched here, before the CLI, a missing or empty API key or an
          # unknown provider, which fail in get_model with no call made, booked the whole max_spend (2026-09-23).
          # Such a failure exits 11 with the marker absent; any failure after the marker is still booked.
          mkdir -p "$RUNNER_TEMP/petri-run"
          python -m scripts.petri_audit.cli run --seeds "$SEEDS_FILE" $ARGS \
            --target "$TARGET" --max-spend "$MAX_SPEND" --epochs "$EPOCHS" --token-limit "$TOKEN_LIMIT" \
            --log-model-api "$LOG_MODEL_API" --out-dir "$RUNNER_TEMP/petri-run" --journal-nonce "$JOURNAL_NONCE" \
            --started-marker "$RUNNER_TEMP/petri-run/target_started"

      # Under readapt the out dir is the SOURCE run's, which holds its landed target sidecar; `--readapt` checks the
      # log is the one that sidecar priced, records the provenance in the manifest, and leaves the sidecar
      # byte-identical (`--report` books no target spend twice). A run's limits come from run_params.json; a
      # readapt's from the log's own config, since the source run's run_params.json is not in its artifact.
      - name: Adapt (sanitised export, transcripts 0.2, rule outcomes, manifest, cost sidecar)
        if: ${{ needs.params.outputs.mode != 'preflight' }}
        env:
          MODE: ${{ needs.params.outputs.mode }}
          SEEDS_FILE: ${{ needs.params.outputs.seeds_file }}
          MAX_SPEND: ${{ needs.params.outputs.max_spend }}
          JUDGE: ${{ needs.params.outputs.judge }}
          JUDGE_MAX_SPEND: ${{ needs.params.outputs.judge_max_spend }}
          TOKEN_LIMIT: ${{ needs.params.outputs.token_limit }}
        run: |
          EVAL=$(ls "$RUNNER_TEMP"/petri-run/logs/*.eval | head -n 1)
          ARGS=""
          if [ "$JUDGE" = "true" ]; then ARGS="--judge-max-spend $JUDGE_MAX_SPEND"; fi
          if [ "$MODE" = "readapt" ]; then
            SOURCE=(--readapt "$RUNNER_TEMP/petri-readapt/plan.json")
          else
            SOURCE=(--run-params "$RUNNER_TEMP/petri-run/run_params.json")
          fi
          python -m scripts.petri_audit.cli adapt --seeds "$SEEDS_FILE" --eval "$EVAL" \
            --out-dir "data/petri/runs/$RUN_STEM" --custody "github_actions_artifact:90d" \
            --max-spend "$MAX_SPEND" --token-limit "$TOKEN_LIMIT" $ARGS --report "${SOURCE[@]}"

      # A readapt's judge runs exactly as a run's; its sidecar carries the readapt fire's nonce, which `cli judge`
      # reads from the manifest's `readapt` block, so reconciliation joins it to the fire that reserved it, and is
      # named for this workflow run (`<stem>.readapt_<run id>.judge.report.json`). If this step fails, the sidecar
      # step below still commits that sidecar and nothing else, and a re-fired readapt is admitted beside it, writes
      # its own, and leaves the earlier one (whose spend is booked) byte-identical.
      - name: Judge of record + analysis rows (paid; mode run or readapt)
        if: ${{ (needs.params.outputs.mode == 'run' || needs.params.outputs.mode == 'readapt') && needs.params.outputs.judge == 'true' }}
        env:
          # the same key set as the run step: the registry resolves a judge spec to whichever provider's key_env it
          # names (Codex round 2: a google: judge used to fail here, after the target had already spent)
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SEEDS_FILE: ${{ needs.params.outputs.seeds_file }}
          JUDGE_MODEL: ${{ needs.params.outputs.judge_model }}
          JUDGE_MAX_SPEND: ${{ needs.params.outputs.judge_max_spend }}
          JUDGE_MAX_TOKENS: ${{ needs.params.outputs.judge_max_tokens }}
        run: |
          # the marker lets the spend-report step tell a judge that started and died from one that never ran
          touch "$RUNNER_TEMP/petri-run/judge_started"
          python -m scripts.petri_audit.cli judge --seeds "$SEEDS_FILE" --run-dir "data/petri/runs/$RUN_STEM" \
            --judge-model "$JUDGE_MODEL" --judge-max-spend "$JUDGE_MAX_SPEND" --judge-max-tokens "$JUDGE_MAX_TOKENS"
          python -m scripts.petri_audit.cli analyze --seeds "$SEEDS_FILE" --run-dir "data/petri/runs/$RUN_STEM"

      - name: Holdout seal check over every publishable Petri output (fails closed)
        if: ${{ needs.params.outputs.mode != 'preflight' }}
        run: |
          python scripts/seal_check.py --site "$RUNNER_TEMP/no-site" --extra data/petri/runs
          python -m scripts.petri_audit.cli verify-chain --data-dir data/petri/runs
          # the run directory alone must verify (manifest digests and every artifact it names), because that is
          # what the dry-run exports artifact carries and what a downloader can check without the chain file
          python -m scripts.petri_audit.cli verify-run --run-dir "data/petri/runs/$RUN_STEM"

      # Runs BEFORE the exports upload below (Codex, PR #27): an artifact cannot be retracted once created, so a raw
      # log inside the checkout must fail the job before any directory under data/petri is uploaded.
      - name: Refuse to publish a raw log (belt and braces)
        if: ${{ always() }}
        run: |
          if find data/petri -name '*.eval' | grep -q .; then
            echo "a raw .eval is inside the checkout; refusing" >&2
            exit 1
          fi

      # Dry-run exports are never committed (mockllm output is not a measurement), but they are the evidence the
      # pilot's structural questions are answered from (design memo section 14), so the seal-cleared run directory
      # is uploaded as a short-lived artifact. Deliberately NOT always(): this step runs only when every step before
      # it succeeded, the seal check, verify-chain, verify-run and the raw-log refusal included, so a rejected export
      # or a run directory holding a raw log is never uploaded; *.eval is excluded from the path as well. The run
      # directory verifies on its own (`cli verify-run`: the manifest's chain block and every artifact it names); the
      # cumulative chain file is NOT included, since it references every earlier committed run the artifact does not
      # carry (Codex, PR #27).
      # A paid run's seal-cleared outputs are uploaded too, and before the commit steps, so a commit that fails after
      # the spend still leaves a recoverable copy (owner decision 8, second round; PR B, 2026-09-18). The first dry run
      # measured the artifact at 40 KB zipped for 8 samples, so size is no objection. The same gating applies: no
      # always(), after the seal check, verify-chain, verify-run and the raw-log refusal.
      - name: Upload the seal-cleared sanitised exports (dry run or paid run; never a raw log)
        if: ${{ needs.params.outputs.mode != 'preflight' }}
        # Non-blocking ONLY where a committed copy follows it. For a paid run that commits, this upload is the
        # recovery copy and its own failure must not skip the commit step below (default success gating), which
        # would leave the measurement neither committed nor recoverable while the always()-gated sidecar step
        # books the spend (Codex round 1 on PR #28). Where nothing is committed - a dry run (Codex round 3), or
        # a paid run with commit_outputs false (Codex round 5) - this artifact is the only seal-cleared copy of
        # the run, so its failure stays fatal rather than reporting success with nothing preserved. The security
        # gates above stay prerequisites in every mode. A readapt is a paid run here (its judge spent).
        continue-on-error: ${{ (needs.params.outputs.mode == 'run' || needs.params.outputs.mode == 'readapt') && needs.params.outputs.commit_outputs == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          # named for THIS workflow run; under readapt the directory is the source run's (the job's RUN_STEM)
          name: petri-audit-exports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/petri/runs/${{ env.RUN_STEM }}/
            !data/petri/runs/**/*.eval
          retention-days: 30
          if-no-files-found: error

      # An attempted run that produced no adapted report (the run exited non-success, or adaptation failed) still
      # spent: a spend report is written from whatever the retained log records, with the ceiling imputed for a
      # priced target when nothing usable was recorded, so the sidecar commit below always has a report to book
      # (Codex round 3).
      - name: Spend report for an attempted run that produced no adapted report
        if: ${{ always() && needs.params.outputs.mode != 'preflight' }}
        env:
          MODE: ${{ needs.params.outputs.mode }}
          JOURNAL_NONCE: ${{ needs.params.outputs._nonce }}
          TARGET: ${{ needs.params.outputs.target }}
          MAX_SPEND: ${{ needs.params.outputs.max_spend }}
          JUDGE: ${{ needs.params.outputs.judge }}
          JUDGE_MODEL: ${{ needs.params.outputs.judge_model }}
          JUDGE_MAX_SPEND: ${{ needs.params.outputs.judge_max_spend }}
          JUDGE_MAX_TOKENS: ${{ needs.params.outputs.judge_max_tokens }}
        run: |
          REPORT="data/petri/runs/$RUN_STEM/$RUN_STEM.report.json"
          if [ "$MODE" = "readapt" ]; then
            # a readapt made no target call; the source run's target spend is booked by its landed sidecar, which
            # this run must never rewrite or duplicate
            echo "readapt: no target call was made; the source run's target spend stays booked by its landed sidecar"
          elif [ -f "$REPORT" ]; then
            echo "adapted report present; nothing to impute for the target"
          elif [ ! -f "$RUNNER_TEMP/petri-run/target_started" ]; then
            # the Run step never began, so no provider call was made and there is nothing to impute. Writing the
            # ceiling here would book a cost that did not happen, and since PR B the nonce would bind it to the
            # fire and make it look like the run's landed spend (Codex round 8 on PR #28)
            echo "target run never started (no marker); no spend to impute"
          else
            ARGS=""
            if [ "$JUDGE" = "true" ]; then ARGS="--judge-max-spend $JUDGE_MAX_SPEND"; fi
            EVAL=$(ls "$RUNNER_TEMP"/petri-run/logs/*.eval 2>/dev/null | head -n 1 || true)
            if [ -n "$EVAL" ]; then ARGS="$ARGS --eval $EVAL"; fi
            mkdir -p "data/petri/runs/$RUN_STEM"
            python -m scripts.petri_audit.cli spend-report --out "$REPORT" --run-id "$RUN_STEM" \
              --target "$TARGET" --max-spend "$MAX_SPEND" $ARGS --journal-nonce "$JOURNAL_NONCE" \
              --reason "run attempted; no adapted report exists (run or adaptation failed)"
          fi
          # a judge that started (marker) and left no sidecar (the process died mid-call) is booked at its ceiling with
          # the surviving rows recorded beside it; a judge that never started books nothing. A readapt's judge names
          # its sidecar for this workflow run (scripts/petri_audit/readapt.py judge_report_name), so an earlier
          # readapt's sidecar in the same directory is never taken for this judge's
          JUDGE_REPORT="data/petri/runs/$RUN_STEM/$RUN_STEM.judge.report.json"
          if [ "$MODE" = "readapt" ]; then JUDGE_REPORT="data/petri/runs/$RUN_STEM/$RUN_STEM.readapt_${GITHUB_RUN_ID}.judge.report.json"; fi
          if [ -f "$RUNNER_TEMP/petri-run/judge_started" ] && [ ! -f "$JUDGE_REPORT" ]; then
            python -m scripts.petri_audit.cli judge-spend-report --run-dir "data/petri/runs/$RUN_STEM" \
              --judge-model "$JUDGE_MODEL" --judge-max-spend "$JUDGE_MAX_SPEND" --judge-max-tokens "$JUDGE_MAX_TOKENS"
          fi

      # Under readapt this re-uploads the downloaded source log under this run's own id: the same bytes (the manifest
      # binds them by raw_eval_log_sha256) with a fresh 90-day custody window.
      - name: Upload the raw .eval as a workflow artifact (90-day custody; never committed)
        if: ${{ always() && needs.params.outputs.mode != 'preflight' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: petri-audit-raw-eval-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/petri-run/logs/
          retention-days: 90
          if-no-files-found: warn

      # Deliberately NOT always(): this step runs only when every step before it succeeded, so an output the
      # holdout seal check or verify-chain rejected, or a half-written export after an adapt or judge failure,
      # can never be committed. Only the raw-log refusal, the artifact upload and the summary are unconditional.
      - name: Commit sanitised outputs to the branch (mode run or readapt; requires every prior step green)
        if: ${{ (needs.params.outputs.mode == 'run' || needs.params.outputs.mode == 'readapt') && needs.params.outputs.commit_outputs == 'true' }}
        env:
          BRANCH: ${{ github.ref_name }}
          MODE: ${{ needs.params.outputs.mode }}
        run: |
          set -euo pipefail
          if find data/petri -name '*.eval' | grep -q .; then echo "raw log present; refusing" >&2; exit 1; fi
          git add -f data/petri/runs/ || true
          if git diff --cached --quiet; then echo "No outputs to commit"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          WHAT="sanitised export, transcripts, manifest"
          if [ "$MODE" = "readapt" ]; then WHAT="$WHAT; re-adapted by workflow run $GITHUB_RUN_ID"; fi
          git commit -m "Petri audit: $RUN_STEM ($WHAT)"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin "$BRANCH" && git push origin HEAD:"refs/heads/$BRANCH"; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 2))
          done
          exit 1

      # Cost sidecars are spend records (model ids, token counts, ceilings, digests; never seed or model text) and
      # the ledger is the only consumer of landed spend, so a paid run books its sidecars whether or not its
      # measurement outputs are committed and whether or not a later step failed (Codex round 2: with
      # commit_outputs=false the runner destroyed them and the spend was never booked). Nothing else is staged.
      # Under readapt the only new sidecar is the judge's; the source run's landed target sidecar, and the judge
      # sidecar of any earlier readapt of the same run, are unchanged, so adding them stages nothing.
      - name: Commit cost sidecars of a paid run (mode run or readapt; independent of commit_outputs)
        if: ${{ always() && (needs.params.outputs.mode == 'run' || needs.params.outputs.mode == 'readapt') }}
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if find data/petri -name '*.eval' | grep -q .; then echo "raw log present; refusing" >&2; exit 1; fi
          # index cleanliness is no proof the sidecars landed: the outputs step may have committed them locally and
          # then failed every push. Measure against the remote and, if local commits never reached it, fall back to
          # the remote head (the files stay in the working tree) and commit the sidecars alone (Codex round 3).
          git fetch origin "$BRANCH"
          if [ -n "$(git log --oneline "origin/$BRANCH..HEAD")" ]; then
            echo "local commit(s) never reached origin/$BRANCH; re-committing the cost sidecars alone"
            git reset --soft "origin/$BRANCH"
            git reset -q
          fi
          for f in data/petri/runs/$RUN_STEM/*.report.json; do
            if [ -f "$f" ]; then git add -f "$f"; fi
          done
          if git diff --cached --quiet; then echo "No cost sidecars to commit (already on the remote, or none written)"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Petri audit: $RUN_STEM cost sidecars"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin "$BRANCH" && git push origin HEAD:"refs/heads/$BRANCH"; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 2))
          done
          exit 1

      # The summary reports what the run wrote (scripts/petri_audit/summary.py): the parameters CI resolved, the
      # measured structure (calls, trees, branches, records, refusals, byte sizes, redaction counts, integrity), the
      # usage status per model labelled provider-measured / mock/non-metered / unavailable, and the cost sidecars.
      # It reads files only, makes no call, and reports its own gaps as `unavailable` rather than failing the job.
      # The rendered text passes the holdout seal before it reaches the job summary (`--seal-scan`): this step is
      # always(), so it runs after a rejected seal check too, and the text quotes manifest strings the seal never
      # scanned (a refusal reason carries Inspect's sample error), so a summary that would print a sealed phrase is
      # withheld in full and only the verdict is printed. The JSON under $RUNNER_TEMP is not published.
      - name: Job summary
        if: ${{ always() }}
        env:
          MODE: ${{ needs.params.outputs.mode }}
          SEEDS_FILE: ${{ needs.params.outputs.seeds_file }}
          RESOLVED_PARAMS: ${{ toJSON(needs.params.outputs) }}
        run: |
          printf '%s' "$RESOLVED_PARAMS" > "$RUNNER_TEMP/resolved_params.json"
          if ! python -m scripts.petri_audit.cli run-summary --run-dir "data/petri/runs/$RUN_STEM" --mode "$MODE" \
              --raw-eval-dir "$RUNNER_TEMP/petri-run/logs" --seeds "$SEEDS_FILE" \
              --params-file "$RUNNER_TEMP/resolved_params.json" --json-out "$RUNNER_TEMP/run_summary.json" \
              --judge-started-marker "$RUNNER_TEMP/petri-run/judge_started" --seal-scan >> "$GITHUB_STEP_SUMMARY"; then
            echo "## Petri audit ($MODE, $RUN_STEM): run-summary failed; see this step's log" >> "$GITHUB_STEP_SUMMARY"
          fi

  # Mode rejudge (2026-09-24; scripts/petri_audit/rejudge.py): re-grade landed runs with a judge other than their judge
  # of record. No target call and no adaptation, so none of the audit job's run steps exist here; nothing under
  # data/petri/runs is written and its manifests chain is not appended to. Paid (the judge) unless the judge is the
  # mockllm/judge rehearsal, which runs the whole job at $0 and commits nothing.
  rejudge:
    if: ${{ !github.event.created && needs.params.outputs.mode == 'rejudge' }}
    needs: params
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          filter: blob:none
          sparse-checkout: |
            .github
            scripts
            data
            medlang_circuits
            docs
            ops
            tests
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # the exact interpreter the environment lock records; verify-lock refuses any other
          python-version: "3.12.3"

      # the judge of record ran in this environment, so the re-grade does too
      - name: Install the locked environment (exact versions from docs/framework/petri_environment.lock.json)
        run: |
          python - <<'EOF'
          import json
          lock = json.load(open("docs/framework/petri_environment.lock.json", encoding="utf-8"))
          with open("petri-lock-requirements.txt", "w", encoding="utf-8") as f:
              for name, version in sorted(lock["packages"].items()):
                  f.write(f"{name}=={version}\n")
          with open("petri-harness-commit.txt", "w", encoding="utf-8") as f:
              f.write(lock["harness"]["commit"])
          EOF
          pip install --quiet -r petri-lock-requirements.txt
          pip install --quiet --no-deps "inspect_petri @ git+https://github.com/michaeldgreenphd/patientwords-inspect_petri@$(cat petri-harness-commit.txt)"
          pip install --quiet -e ".[llm]" pyyaml
          rm -f petri-lock-requirements.txt petri-harness-commit.txt

      - name: Verify the environment lock (refuses any drift before a model call)
        run: python -m scripts.petri_audit.cli verify-lock

      # No model call. Every source run must verify on its own and be chained, its judge of record must be another
      # judge under the same judge_max_tokens, its output directory must hold no re-grade (only earlier failed fires'
      # judge sidecars, each accounted for by exactly one journal entry), and the judgments planned from its committed
      # transcripts must be exactly the ones its judge of record made, rendered prompt and context digest for digest.
      - name: Plan the rejudge (verify the source runs and the instrument; no model call)
        id: plan
        env:
          RESOLVED_PARAMS: ${{ toJSON(needs.params.outputs) }}
        run: |
          mkdir -p "$RUNNER_TEMP/petri-rejudge/started"
          printf '%s' "$RESOLVED_PARAMS" > "$RUNNER_TEMP/petri-rejudge/params.json"
          python -m scripts.petri_audit.cli rejudge-plan --params-file "$RUNNER_TEMP/petri-rejudge/params.json" \
            --runs-dir data/petri/runs --rejudge-root data/petri/rejudge \
            --rejudge-run-id "$GITHUB_RUN_ID" --rejudge-run-attempt "$GITHUB_RUN_ATTEMPT" --rejudge-commit "$GITHUB_SHA" \
            --out "$RUNNER_TEMP/petri-rejudge/plan.json"

      # Before each source run's first call the CLI writes a marker under the runner's temp directory naming its
      # sidecar and its allotment of the fire's ceiling; the always()-gated spend report below books that allotment
      # for a run whose judge started and left no sidecar. A judge client that raises leaves its sidecar (exit 8).
      - name: Rejudge (paid unless the judge is mockllm/judge; no target call)
        id: rejudge
        env:
          # the same key set as the audit job's judge step: the registry resolves a judge spec to its provider's key_env
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -m scripts.petri_audit.cli rejudge --plan "$RUNNER_TEMP/petri-rejudge/plan.json" \
            --started-dir "$RUNNER_TEMP/petri-rejudge/started"

      # always() once the plan succeeded (PR #41 review): a later source run whose judge aborted must not discard an
      # earlier one that completed. Fails closed. verify-rejudge checks each re-grade this fire wrote a manifest into
      # (the executor writes it last, so an aborted run's partial rows have none and are never touched), on its own and
      # against its source run; only when every one verifies does it copy them outside the checkout for the upload and
      # write the list of what the commit stages: those directories and this fire's sidecars. The seal check then
      # sweeps exactly that list, and the runs read, before the step can succeed.
      - name: Verify the re-grades and seal-check exactly what is staged (fails closed)
        id: verify
        if: ${{ always() && steps.plan.outcome == 'success' }}
        run: |
          set -euo pipefail
          python -m scripts.petri_audit.cli verify-chain --data-dir data/petri/runs
          python -m scripts.petri_audit.cli verify-rejudge --plan "$RUNNER_TEMP/petri-rejudge/plan.json" \
            --runs-dir data/petri/runs --copy-to "$RUNNER_TEMP/petri-rejudge/exports" \
            --verified-list "$RUNNER_TEMP/petri-rejudge/verified.txt" --stage-list "$RUNNER_TEMP/petri-rejudge/stage.txt"
          EXTRA="data/petri/runs"
          while IFS= read -r path; do EXTRA="$EXTRA,$path"; done < "$RUNNER_TEMP/petri-rejudge/stage.txt"
          python scripts/seal_check.py --site "$RUNNER_TEMP/no-site" --extra "$EXTRA"
          echo "verified=$(grep -c . "$RUNNER_TEMP/petri-rejudge/verified.txt" || true)" >> "$GITHUB_OUTPUT"

      - name: Refuse to publish a raw log (belt and braces)
        id: rawlog
        if: ${{ always() }}
        run: |
          if find data/petri -name '*.eval' | grep -q .; then
            echo "a raw .eval is inside the checkout; refusing" >&2
            exit 1
          fi

      # The seal-cleared re-grades of this fire, as the audit job uploads a run's: the only copy of a rehearsal, and the
      # recovery copy of a paid rejudge that commits (non-blocking only there, so its own failure cannot skip the
      # commit). Only when the verification and seal check passed, at least one re-grade verified, and the raw-log
      # refusal passed; a later run's abort no longer skips it.
      - name: Upload the seal-cleared re-grades (rehearsal or paid; never a raw log)
        if: ${{ always() && steps.verify.outcome == 'success' && steps.verify.outputs.verified != '0' && steps.rawlog.outcome == 'success' }}
        continue-on-error: ${{ needs.params.outputs.rehearsal != 'true' && needs.params.outputs.commit_outputs == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: petri-audit-rejudge-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/petri-rejudge/exports/
          retention-days: 30
          if-no-files-found: error

      # A judge that started on a source run and left no sidecar (the process died mid-call) is booked at that run's
      # allotment of the fire's ceiling; a run whose judge never started books nothing. The rehearsal spends nothing.
      - name: Spend report for a rejudge judge that started and left no sidecar
        if: ${{ always() && needs.params.outputs.rehearsal != 'true' }}
        run: |
          python -m scripts.petri_audit.cli rejudge-spend-report --plan "$RUNNER_TEMP/petri-rejudge/plan.json" \
            --started-dir "$RUNNER_TEMP/petri-rejudge/started"

      # always() so a later source run's abort does not discard an earlier one's completed re-grade (PR #41 review),
      # but only once the verification and the seal check over exactly what is staged succeeded and the raw-log
      # refusal passed: it stages the list verify-rejudge wrote (the verified directories and this fire's sidecars) and
      # nothing else, never the rejudge root wholesale, so an aborted run's partial rows stay out. Never the rehearsal.
      - name: Commit the re-grades to the branch (paid rejudge with commit_outputs; the verified re-grades only)
        if: ${{ always() && steps.verify.outcome == 'success' && steps.verify.outputs.verified != '0' && steps.rawlog.outcome == 'success' && needs.params.outputs.rehearsal != 'true' && needs.params.outputs.commit_outputs == 'true' }}
        env:
          BRANCH: ${{ github.ref_name }}
          JUDGE_MODEL: ${{ needs.params.outputs.judge_model }}
          SOURCE_RUNS: ${{ needs.params.outputs.source_runs }}
        run: |
          set -euo pipefail
          if find data/petri -name '*.eval' | grep -q .; then echo "raw log present; refusing" >&2; exit 1; fi
          while IFS= read -r path; do git add -f -- "$path"; done < "$RUNNER_TEMP/petri-rejudge/stage.txt"
          if git diff --cached --quiet; then echo "No re-grades to commit"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Petri rejudge (exploratory): $JUDGE_MODEL over $SOURCE_RUNS (workflow run $GITHUB_RUN_ID)"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin "$BRANCH" && git push origin HEAD:"refs/heads/$BRANCH"; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 2))
          done
          exit 1

      # The judge cost sidecars are spend records (model ids, token counts, ceilings, digests; never text), booked
      # whether or not the re-grades were committed and whether or not a later step failed. Nothing else is staged;
      # an earlier fire's sidecar in the same directory is unchanged, so adding it stages nothing. Never the rehearsal.
      - name: Commit rejudge cost sidecars (paid rejudge; independent of commit_outputs)
        if: ${{ always() && needs.params.outputs.rehearsal != 'true' }}
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if find data/petri -name '*.eval' | grep -q .; then echo "raw log present; refusing" >&2; exit 1; fi
          git fetch origin "$BRANCH"
          if [ -n "$(git log --oneline "origin/$BRANCH..HEAD")" ]; then
            echo "local commit(s) never reached origin/$BRANCH; re-committing the cost sidecars alone"
            git reset --soft "origin/$BRANCH"
            git reset -q
          fi
          for f in data/petri/rejudge/*/*/*.report.json; do
            if [ -f "$f" ]; then git add -f "$f"; fi
          done
          if git diff --cached --quiet; then echo "No rejudge cost sidecars to commit (already on the remote, or none written)"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Petri rejudge: cost sidecars (workflow run $GITHUB_RUN_ID)"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin "$BRANCH" && git push origin HEAD:"refs/heads/$BRANCH"; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 2))
          done
          exit 1

      # Counts and cost per source run, never text; passed through the holdout seal before it is published.
      - name: Job summary
        if: ${{ always() }}
        run: |
          if ! python -m scripts.petri_audit.cli rejudge-summary --plan "$RUNNER_TEMP/petri-rejudge/plan.json" \
              --seal-scan >> "$GITHUB_STEP_SUMMARY"; then
            echo "## Petri rejudge: rejudge-summary failed; see this step's log" >> "$GITHUB_STEP_SUMMARY"
          fi
