name: Petri Audit (medlang-circuits)

# PatientWords multi-turn register experiments executed through the Petri
# harness (docs/petri_integration_design.md). PAID when mode is `run`: the
# target model and the optional judge spend provider tokens under max_spend
# and judge_max_spend; `preflight` validates seeds, verifies the exact
# environment lock, prices the run and bounds it, and calls nothing;
# `dry_run` executes the whole pipeline against mockllm at $0.
#
# The raw Inspect .eval log is NEVER committed: it is written outside the
# checkout, uploaded as a workflow artifact with 90-day retention, and bound
# to the committed manifest by sha256. Only the sanitised allowlist
# projection, the transcripts, the rule outcomes, the judgments and the
# manifest enter the repository.
#
# Start it from the Actions tab (workflow_dispatch) or by pushing a params file
# to .github/trigger/petri-audit.json via scripts/fire_trigger.py ONLY. The
# trigger file is created by `fire_trigger.py park --trigger petri-audit`
# after this workflow lands, never by hand; until it exists, no push fires
# this lane. Owner rule (2026-09-16): no fire of any mode until the owner
# authorises the first execution explicitly.

on:
  workflow_dispatch:
    inputs:
      seeds_file:
        description: "Seed file (docs/framework/petri_seeds.draft.json or a successor)"
        type: string
        default: "docs/framework/petri_seeds.draft.json"
      seed_ids:
        description: "Space-separated seed ids to run (empty = every seed of the wave)"
        type: string
        default: ""
      wave:
        description: "Pilot wave to select when seed_ids is empty (1 = the first end-to-end pilot)"
        type: string
        default: "1"
      target:
        description: "Inspect target model string, e.g. anthropic/claude-haiku-4-5 (mockllm/model under dry_run)"
        type: string
        default: "mockllm/model"
      mode:
        description: "preflight (no calls), dry_run (mockllm, $0), run (paid)"
        type: string
        default: "preflight"
      epochs:
        description: "Repeats per condition (the pilot's provisional R)"
        type: string
        default: "1"
      token_limit:
        description: "Per-sample token limit passed to Inspect (input + output)"
        type: string
        default: "20000"
      max_spend:
        description: "HARD spend ceiling in USD for the target calls (required, counted by the guard)"
        type: string
        default: "0.01"
      judge:
        description: "Also run the judge of record over the exported records (paid)"
        type: boolean
        default: false
      judge_model:
        description: "Judge model spec (registry: bare Anthropic id or provider:model)"
        type: string
        default: "claude-haiku-4-5"
      judge_max_spend:
        description: "HARD judge spend ceiling in USD"
        type: string
        default: "0.01"
      judge_max_tokens:
        description: "Max output tokens per judge call"
        type: string
        default: "300"
      log_model_api:
        description: "Keep every raw provider request and response in the (unpublished) .eval"
        type: boolean
        default: true
      commit_outputs:
        description: "Commit the sanitised exports, transcripts, judgments and manifest back to the branch (mode run only)"
        type: boolean
        default: false
  push:
    paths:
      - ".github/trigger/petri-audit.json"

permissions:
  contents: write
  actions: read

concurrency:
  group: petri-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  params:
    # A push that creates a ref carries created:true, and on a new ref every
    # trigger file counts as changed. Skip on creation; fires are pushes to
    # existing branches.
    if: ${{ !github.event.created }}
    runs-on: ubuntu-latest
    outputs:
      seeds_file: ${{ steps.params.outputs.seeds_file }}
      seed_ids: ${{ steps.params.outputs.seed_ids }}
      wave: ${{ steps.params.outputs.wave }}
      target: ${{ steps.params.outputs.target }}
      mode: ${{ steps.params.outputs.mode }}
      epochs: ${{ steps.params.outputs.epochs }}
      token_limit: ${{ steps.params.outputs.token_limit }}
      max_spend: ${{ steps.params.outputs.max_spend }}
      judge: ${{ steps.params.outputs.judge }}
      judge_model: ${{ steps.params.outputs.judge_model }}
      judge_max_spend: ${{ steps.params.outputs.judge_max_spend }}
      judge_max_tokens: ${{ steps.params.outputs.judge_max_tokens }}
      log_model_api: ${{ steps.params.outputs.log_model_api }}
      commit_outputs: ${{ steps.params.outputs.commit_outputs }}
      # the fire's `_nonce` (pass-through metadata, never a trigger key): the run records it so its cost sidecar can be
      # reconciled with the journal entry that reserved the spend (PR B, 2026-09-18)
      _nonce: ${{ steps.params.outputs._nonce }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          filter: blob:none
          # the daily-ceiling gate reads the journal at github.event.before to tell a fire from a replay of one,
          # and a depth-1 clone has no commit to read it at; blobless keeps full history cheap
          fetch-depth: 0
          sparse-checkout: |
            .github
            scripts
            data
            medlang_circuits
            docs
            ops
            tests
      - name: Resolve parameters
        id: params
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          IN_SEEDS_FILE: ${{ inputs.seeds_file }}
          IN_SEED_IDS: ${{ inputs.seed_ids }}
          IN_WAVE: ${{ inputs.wave }}
          IN_TARGET: ${{ inputs.target }}
          IN_MODE: ${{ inputs.mode }}
          IN_EPOCHS: ${{ inputs.epochs }}
          IN_TOKEN_LIMIT: ${{ inputs.token_limit }}
          IN_MAX_SPEND: ${{ inputs.max_spend }}
          IN_JUDGE: ${{ inputs.judge }}
          IN_JUDGE_MODEL: ${{ inputs.judge_model }}
          IN_JUDGE_MAX_SPEND: ${{ inputs.judge_max_spend }}
          IN_JUDGE_MAX_TOKENS: ${{ inputs.judge_max_tokens }}
          IN_LOG_MODEL_API: ${{ inputs.log_model_api }}
          IN_COMMIT_OUTPUTS: ${{ inputs.commit_outputs }}
        run: |
          python - <<'EOF'
          import json, os
          # The push-path defaults dict MUST contain every trigger key (unknown
          # keys in the trigger file are silently ignored by design; the fire
          # guard's KNOWN_KEYS mirrors this set).
          defaults = {"seeds_file": "docs/framework/petri_seeds.draft.json",
                      "seed_ids": "",
                      "wave": "1",
                      "target": "mockllm/model",
                      "mode": "preflight",
                      "epochs": "1",
                      "token_limit": "20000",
                      "max_spend": "0.01",
                      "judge": "false",
                      "judge_model": "claude-haiku-4-5",
                      "judge_max_spend": "0.01",
                      "judge_max_tokens": "300",
                      "log_model_api": "true",
                      "commit_outputs": "false"}
          p = dict(defaults)
          nonce = ""                        # the fire's _nonce, metadata beside the trigger keys (empty on dispatch)
          if os.environ["EVENT_NAME"] == "push":
              with open(".github/trigger/petri-audit.json", encoding="utf-8") as f:
                  cfg = json.load(f)
              nonce = str(cfg.get("_nonce") or "")
              if isinstance(cfg.get("seed_ids"), list):
                  cfg["seed_ids"] = " ".join(str(s) for s in cfg["seed_ids"])
              p.update({k: (str(v).lower() if isinstance(v, bool) else str(v))
                        for k, v in cfg.items() if k in defaults})
          else:
              for k in defaults:
                  v = os.environ.get("IN_" + k.upper(), "")
                  if v:
                      p[k] = v
          if p["mode"] not in ("preflight", "dry_run", "run"):
              raise SystemExit("mode must be preflight, dry_run or run")
          if p["mode"] == "dry_run" and p["target"] != "mockllm/model":
              raise SystemExit("dry_run runs against mockllm/model only")
          # every mock/test sentinel, not just the one dry_run uses: `mockllm/judge` and `none/none` price at
          # zero in the engine's table, so naming one as a run target passed the paid pre-flight bound for free
          # and could commit mock output through the production path (Codex round 5)
          if p["mode"] == "run" and p["target"].split("/")[0] in ("mockllm", "none"):
              raise SystemExit(f"mode run needs a real target, not the test sentinel {p['target']!r}; "
                               "use dry_run for mockllm")
          # every target that is not openrouter/ is booked to the Anthropic lane (fire_trigger.petri_channels), but the
          # run step also exports the direct OpenAI and Gemini keys, so openai/... or google/... would bill a vendor key
          # against the Anthropic ceiling; cli preflight refuses the same spellings (spend.target_provider_problems)
          if p["mode"] == "run" and "/" in p["target"] and p["target"].split("/")[0] not in ("anthropic", "openrouter"):
              raise SystemExit(f"mode run books every target that is not openrouter/ to the Anthropic lane, but "
                               f"{p['target']!r} bills its own vendor key; route it through OpenRouter as "
                               "openrouter/<vendor>/<model> (for example openrouter/openai/gpt-5.4-mini)")
          # a paid run is admitted only from a push-to-run fire on its first attempt: the fire path journals the
          # reservation the daily ceiling counts, and neither a workflow_dispatch nor an Actions-tab re-run has one
          # of its own (Codex round 8); preflight and dry_run cost nothing and may run from anywhere
          if p["mode"] == "run" and os.environ["EVENT_NAME"] != "push":
              raise SystemExit("mode run is fired through scripts/fire_trigger.py only (its journal entry is the "
                               "reservation the daily ceiling counts); a workflow_dispatch may run preflight or dry_run")
          if p["mode"] == "run" and os.environ.get("RUN_ATTEMPT", "1") != "1":
              raise SystemExit("mode run cannot be re-run from the Actions tab (attempt "
                               f"{os.environ.get('RUN_ATTEMPT')} has no reservation of its own); re-fire through "
                               "scripts/fire_trigger.py")
          float(p["max_spend"]); float(p["judge_max_spend"]); int(p["epochs"]); int(p["token_limit"])
          # the judge's token allowance is parsed here too (Codex round 6): a bad value used to fail only in the
          # judge step's argparse, after every target call had spent and the judge_started marker was set
          if int(p["judge_max_tokens"]) <= 0:
              raise SystemExit(f"judge_max_tokens must be a positive integer, got {p['judge_max_tokens']!r}")
          # boolean keys are compared against "true" exactly downstream, so every spelling other than true/false
          # (a typo, "yes", "True") is refused here rather than silently read as false after a paid step
          for k in ("judge", "log_model_api", "commit_outputs"):
              v = p[k].strip().lower()
              if v not in ("true", "false"):
                  raise SystemExit(f"{k} must be true or false, got {p[k]!r}")
              p[k] = v
          # Every value below is written as one `key=value` line, and a later duplicate key wins, so a value
          # carrying a newline writes further key=value lines of its own: a trigger file whose `target` or
          # `_nonce` held one could rewrite mode, a ceiling or commit_outputs AFTER the checks above passed.
          # `_nonce` is written last, so an injected line there overrides every key. fire_trigger.py refuses
          # such a value at the fire, and this refuses it again for a trigger file no fire wrote (PR B).
          for k, v in list(p.items()) + [("_nonce", nonce)]:
              if any(ord(c) < 32 or ord(c) == 127 for c in v):
                  raise SystemExit(f"{k} must not carry a control character (newline, carriage return, tab), got {v!r}")
          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a", encoding="utf-8") as f:
              for k in defaults:
                  f.write(k + "=" + p[k] + "\n")
              f.write("_nonce=" + nonce + "\n")
          print(" | ".join(f"{k}={p[k]}" for k in sorted(defaults)))
          EOF

      - name: Daily-ceiling gate (server-side; same budget_check as the fire guard)
        env:
          GATE_PARAMS: ${{ toJSON(steps.params.outputs) }}
          # the ref's tip BEFORE this push. fire_trigger writes the journal entry and the trigger file in one
          # commit, so a reservation already present at that commit was taken by an earlier fire and this push is
          # a replay of it - which identical bytes restored by a merge otherwise pass (Codex round 10 on PR #28)
          PUSH_BEFORE: ${{ github.event.before }}
          # the ref this run is on. A reservation is for one ref as well as one push: the same fire commit
          # reaching a second branch by merge or cherry-pick appears there for the first time, so the push
          # binding alone would read it as a fresh reservation (Codex round 11 on PR #28)
          REF_NAME: ${{ github.ref_name }}
        run: |
          printf '%s' "$GATE_PARAMS" > "$RUNNER_TEMP/gate_params.json"
          python3 scripts/fire_trigger.py budget-gate --trigger petri-audit --params-file "$RUNNER_TEMP/gate_params.json" --push-before "$PUSH_BEFORE" --ref "$REF_NAME"

  audit:
    if: ${{ !github.event.created }}
    needs: params
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          filter: blob:none
          sparse-checkout: |
            .github
            scripts
            data
            medlang_circuits
            docs
            ops
            tests
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # the exact interpreter the environment lock records; verify-lock refuses any other
          python-version: "3.12.3"

      - name: Install the locked environment (exact versions from docs/framework/petri_environment.lock.json)
        run: |
          python - <<'EOF'
          import json
          lock = json.load(open("docs/framework/petri_environment.lock.json", encoding="utf-8"))
          with open("petri-lock-requirements.txt", "w", encoding="utf-8") as f:
              for name, version in sorted(lock["packages"].items()):
                  f.write(f"{name}=={version}\n")
          with open("petri-harness-commit.txt", "w", encoding="utf-8") as f:
              f.write(lock["harness"]["commit"])
          EOF
          pip install --quiet -r petri-lock-requirements.txt
          pip install --quiet --no-deps "inspect_petri @ git+https://github.com/michaeldgreenphd/patientwords-inspect_petri@$(cat petri-harness-commit.txt)"
          pip install --quiet -e ".[llm]" pyyaml
          rm -f petri-lock-requirements.txt petri-harness-commit.txt

      - name: Verify the environment lock (refuses any drift before a model call)
        run: python -m scripts.petri_audit.cli verify-lock

      - name: Validate seeds
        env:
          SEEDS_FILE: ${{ needs.params.outputs.seeds_file }}
          SEED_IDS: ${{ needs.params.outputs.seed_ids }}
          WAVE: ${{ needs.params.outputs.wave }}
        run: |
          ARGS=""
          for s in $SEED_IDS; do ARGS="$ARGS --seed-id $s"; done
          if [ -z "$SEED_IDS" ]; then ARGS="--wave $WAVE"; fi
          python -m scripts.petri_audit.cli validate-seeds --seeds "$SEEDS_FILE" $ARGS

      - name: Preflight (prices, bound, lock; no model call)
        env:
          SEEDS_FILE: ${{ needs.params.outputs.seeds_file }}
          SEED_IDS: ${{ needs.params.outputs.seed_ids }}
          WAVE: ${{ needs.params.outputs.wave }}
          TARGET: ${{ needs.params.outputs.target }}
          MAX_SPEND: ${{ needs.params.outputs.max_spend }}
          JUDGE: ${{ needs.params.outputs.judge }}
          JUDGE_MODEL: ${{ needs.params.outputs.judge_model }}
          JUDGE_MAX_SPEND: ${{ needs.params.outputs.judge_max_spend }}
          EPOCHS: ${{ needs.params.outputs.epochs }}
          TOKEN_LIMIT: ${{ needs.params.outputs.token_limit }}
        run: |
          ARGS=""
          for s in $SEED_IDS; do ARGS="$ARGS --seed-id $s"; done
          if [ -z "$SEED_IDS" ]; then ARGS="--wave $WAVE"; fi
          if [ "$JUDGE" = "true" ]; then ARGS="$ARGS --judge-max-spend $JUDGE_MAX_SPEND --judge-model $JUDGE_MODEL"; fi
          python -m scripts.petri_audit.cli preflight --seeds "$SEEDS_FILE" $ARGS \
            --target "$TARGET" --max-spend "$MAX_SPEND" --epochs "$EPOCHS" --token-limit "$TOKEN_LIMIT"

      - name: Run (mode dry_run or run; the raw .eval is written OUTSIDE the checkout)
        if: ${{ needs.params.outputs.mode != 'preflight' }}
        env:
          JOURNAL_NONCE: ${{ needs.params.outputs._nonce }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SEEDS_FILE: ${{ needs.params.outputs.seeds_file }}
          SEED_IDS: ${{ needs.params.outputs.seed_ids }}
          WAVE: ${{ needs.params.outputs.wave }}
          TARGET: ${{ needs.params.outputs.target }}
          MAX_SPEND: ${{ needs.params.outputs.max_spend }}
          JUDGE: ${{ needs.params.outputs.judge }}
          JUDGE_MODEL: ${{ needs.params.outputs.judge_model }}
          JUDGE_MAX_SPEND: ${{ needs.params.outputs.judge_max_spend }}
          EPOCHS: ${{ needs.params.outputs.epochs }}
          TOKEN_LIMIT: ${{ needs.params.outputs.token_limit }}
          LOG_MODEL_API: ${{ needs.params.outputs.log_model_api }}
        run: |
          ARGS=""
          for s in $SEED_IDS; do ARGS="$ARGS --seed-id $s"; done
          if [ -z "$SEED_IDS" ]; then ARGS="--wave $WAVE"; fi
          if [ "$JUDGE" = "true" ]; then ARGS="$ARGS --judge-max-spend $JUDGE_MAX_SPEND --judge-model $JUDGE_MODEL"; fi
          # The target-start marker, the twin of the judge's, marks the point from which a provider call can spend.
          # The always()-gated spend report runs even when a step BEFORE the call failed - seed validation, the
          # environment lock, preflight - and with no eval log it imputes the FULL target ceiling; since PR B binds
          # the journal nonce into that sidecar, the ledger would fold a cost for a run that made no provider call
          # (Codex round 8 on PR #28). `cli run` writes it (--started-marker) after the target model is built and
          # priced, immediately before the eval: touched here, before the CLI, a missing or empty API key or an
          # unknown provider, which fail in get_model with no call made, booked the whole max_spend (2026-09-23).
          # Such a failure exits 11 with the marker absent; any failure after the marker is still booked.
          mkdir -p "$RUNNER_TEMP/petri-run"
          python -m scripts.petri_audit.cli run --seeds "$SEEDS_FILE" $ARGS \
            --target "$TARGET" --max-spend "$MAX_SPEND" --epochs "$EPOCHS" --token-limit "$TOKEN_LIMIT" \
            --log-model-api "$LOG_MODEL_API" --out-dir "$RUNNER_TEMP/petri-run" --journal-nonce "$JOURNAL_NONCE" \
            --started-marker "$RUNNER_TEMP/petri-run/target_started"

      - name: Adapt (sanitised export, transcripts 0.2, rule outcomes, manifest, cost sidecar)
        if: ${{ needs.params.outputs.mode != 'preflight' }}
        env:
          SEEDS_FILE: ${{ needs.params.outputs.seeds_file }}
          MAX_SPEND: ${{ needs.params.outputs.max_spend }}
          JUDGE: ${{ needs.params.outputs.judge }}
          JUDGE_MAX_SPEND: ${{ needs.params.outputs.judge_max_spend }}
          TOKEN_LIMIT: ${{ needs.params.outputs.token_limit }}
          RUN_STEM: run_${{ github.run_id }}_${{ github.run_attempt }}
        run: |
          EVAL=$(ls "$RUNNER_TEMP"/petri-run/logs/*.eval | head -n 1)
          ARGS=""
          if [ "$JUDGE" = "true" ]; then ARGS="--judge-max-spend $JUDGE_MAX_SPEND"; fi
          python -m scripts.petri_audit.cli adapt --seeds "$SEEDS_FILE" --eval "$EVAL" \
            --out-dir "data/petri/runs/$RUN_STEM" --custody "github_actions_artifact:90d" \
            --max-spend "$MAX_SPEND" --token-limit "$TOKEN_LIMIT" $ARGS --report \
            --run-params "$RUNNER_TEMP/petri-run/run_params.json"

      - name: Judge of record + analysis rows (paid; mode run only)
        if: ${{ needs.params.outputs.mode == 'run' && needs.params.outputs.judge == 'true' }}
        env:
          # the same key set as the run step: the registry resolves a judge spec to whichever provider's key_env it
          # names (Codex round 2: a google: judge used to fail here, after the target had already spent)
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SEEDS_FILE: ${{ needs.params.outputs.seeds_file }}
          JUDGE_MODEL: ${{ needs.params.outputs.judge_model }}
          JUDGE_MAX_SPEND: ${{ needs.params.outputs.judge_max_spend }}
          JUDGE_MAX_TOKENS: ${{ needs.params.outputs.judge_max_tokens }}
          RUN_STEM: run_${{ github.run_id }}_${{ github.run_attempt }}
        run: |
          # the marker lets the spend-report step tell a judge that started and died from one that never ran
          touch "$RUNNER_TEMP/petri-run/judge_started"
          python -m scripts.petri_audit.cli judge --seeds "$SEEDS_FILE" --run-dir "data/petri/runs/$RUN_STEM" \
            --judge-model "$JUDGE_MODEL" --judge-max-spend "$JUDGE_MAX_SPEND" --judge-max-tokens "$JUDGE_MAX_TOKENS"
          python -m scripts.petri_audit.cli analyze --seeds "$SEEDS_FILE" --run-dir "data/petri/runs/$RUN_STEM"

      - name: Holdout seal check over every publishable Petri output (fails closed)
        if: ${{ needs.params.outputs.mode != 'preflight' }}
        env:
          RUN_STEM: run_${{ github.run_id }}_${{ github.run_attempt }}
        run: |
          python scripts/seal_check.py --site "$RUNNER_TEMP/no-site" --extra data/petri/runs
          python -m scripts.petri_audit.cli verify-chain --data-dir data/petri/runs
          # the run directory alone must verify (manifest digests and every artifact it names), because that is
          # what the dry-run exports artifact carries and what a downloader can check without the chain file
          python -m scripts.petri_audit.cli verify-run --run-dir "data/petri/runs/$RUN_STEM"

      # Runs BEFORE the exports upload below (Codex, PR #27): an artifact cannot be retracted once created, so a raw
      # log inside the checkout must fail the job before any directory under data/petri is uploaded.
      - name: Refuse to publish a raw log (belt and braces)
        if: ${{ always() }}
        run: |
          if find data/petri -name '*.eval' | grep -q .; then
            echo "a raw .eval is inside the checkout; refusing" >&2
            exit 1
          fi

      # Dry-run exports are never committed (mockllm output is not a measurement), but they are the evidence the
      # pilot's structural questions are answered from (design memo section 14), so the seal-cleared run directory
      # is uploaded as a short-lived artifact. Deliberately NOT always(): this step runs only when every step before
      # it succeeded, the seal check, verify-chain, verify-run and the raw-log refusal included, so a rejected export
      # or a run directory holding a raw log is never uploaded; *.eval is excluded from the path as well. The run
      # directory verifies on its own (`cli verify-run`: the manifest's chain block and every artifact it names); the
      # cumulative chain file is NOT included, since it references every earlier committed run the artifact does not
      # carry (Codex, PR #27).
      # A paid run's seal-cleared outputs are uploaded too, and before the commit steps, so a commit that fails after
      # the spend still leaves a recoverable copy (owner decision 8, second round; PR B, 2026-09-18). The first dry run
      # measured the artifact at 40 KB zipped for 8 samples, so size is no objection. The same gating applies: no
      # always(), after the seal check, verify-chain, verify-run and the raw-log refusal.
      - name: Upload the seal-cleared sanitised exports (dry run or paid run; never a raw log)
        if: ${{ needs.params.outputs.mode != 'preflight' }}
        # Non-blocking ONLY where a committed copy follows it. For a paid run that commits, this upload is the
        # recovery copy and its own failure must not skip the commit step below (default success gating), which
        # would leave the measurement neither committed nor recoverable while the always()-gated sidecar step
        # books the spend (Codex round 1 on PR #28). Where nothing is committed - a dry run (Codex round 3), or
        # a paid run with commit_outputs false (Codex round 5) - this artifact is the only seal-cleared copy of
        # the run, so its failure stays fatal rather than reporting success with nothing preserved. The security
        # gates above stay prerequisites in every mode.
        continue-on-error: ${{ needs.params.outputs.mode == 'run' && needs.params.outputs.commit_outputs == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: petri-audit-exports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/petri/runs/run_${{ github.run_id }}_${{ github.run_attempt }}/
            !data/petri/runs/**/*.eval
          retention-days: 30
          if-no-files-found: error

      # An attempted run that produced no adapted report (the run exited non-success, or adaptation failed) still
      # spent: a spend report is written from whatever the retained log records, with the ceiling imputed for a
      # priced target when nothing usable was recorded, so the sidecar commit below always has a report to book
      # (Codex round 3).
      - name: Spend report for an attempted run that produced no adapted report
        if: ${{ always() && needs.params.outputs.mode != 'preflight' }}
        env:
          JOURNAL_NONCE: ${{ needs.params.outputs._nonce }}
          TARGET: ${{ needs.params.outputs.target }}
          MAX_SPEND: ${{ needs.params.outputs.max_spend }}
          JUDGE: ${{ needs.params.outputs.judge }}
          JUDGE_MODEL: ${{ needs.params.outputs.judge_model }}
          JUDGE_MAX_SPEND: ${{ needs.params.outputs.judge_max_spend }}
          JUDGE_MAX_TOKENS: ${{ needs.params.outputs.judge_max_tokens }}
          RUN_STEM: run_${{ github.run_id }}_${{ github.run_attempt }}
        run: |
          REPORT="data/petri/runs/$RUN_STEM/$RUN_STEM.report.json"
          if [ -f "$REPORT" ]; then
            echo "adapted report present; nothing to impute for the target"
          elif [ ! -f "$RUNNER_TEMP/petri-run/target_started" ]; then
            # the Run step never began, so no provider call was made and there is nothing to impute. Writing the
            # ceiling here would book a cost that did not happen, and since PR B the nonce would bind it to the
            # fire and make it look like the run's landed spend (Codex round 8 on PR #28)
            echo "target run never started (no marker); no spend to impute"
          else
            ARGS=""
            if [ "$JUDGE" = "true" ]; then ARGS="--judge-max-spend $JUDGE_MAX_SPEND"; fi
            EVAL=$(ls "$RUNNER_TEMP"/petri-run/logs/*.eval 2>/dev/null | head -n 1 || true)
            if [ -n "$EVAL" ]; then ARGS="$ARGS --eval $EVAL"; fi
            mkdir -p "data/petri/runs/$RUN_STEM"
            python -m scripts.petri_audit.cli spend-report --out "$REPORT" --run-id "$RUN_STEM" \
              --target "$TARGET" --max-spend "$MAX_SPEND" $ARGS --journal-nonce "$JOURNAL_NONCE" \
              --reason "run attempted; no adapted report exists (run or adaptation failed)"
          fi
          # a judge that started (marker) and left no sidecar (the process died mid-call) is booked at its ceiling with
          # the surviving rows recorded beside it; a judge that never started books nothing
          if [ -f "$RUNNER_TEMP/petri-run/judge_started" ] && [ ! -f "data/petri/runs/$RUN_STEM/$RUN_STEM.judge.report.json" ]; then
            python -m scripts.petri_audit.cli judge-spend-report --run-dir "data/petri/runs/$RUN_STEM" \
              --judge-model "$JUDGE_MODEL" --judge-max-spend "$JUDGE_MAX_SPEND" --judge-max-tokens "$JUDGE_MAX_TOKENS"
          fi

      - name: Upload the raw .eval as a workflow artifact (90-day custody; never committed)
        if: ${{ always() && needs.params.outputs.mode != 'preflight' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: petri-audit-raw-eval-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/petri-run/logs/
          retention-days: 90
          if-no-files-found: warn

      # Deliberately NOT always(): this step runs only when every step before it succeeded, so an output the
      # holdout seal check or verify-chain rejected, or a half-written export after an adapt or judge failure,
      # can never be committed. Only the raw-log refusal, the artifact upload and the summary are unconditional.
      - name: Commit sanitised outputs to the branch (mode run only; requires every prior step green)
        if: ${{ needs.params.outputs.mode == 'run' && needs.params.outputs.commit_outputs == 'true' }}
        env:
          BRANCH: ${{ github.ref_name }}
          RUN_STEM: run_${{ github.run_id }}_${{ github.run_attempt }}
        run: |
          set -euo pipefail
          if find data/petri -name '*.eval' | grep -q .; then echo "raw log present; refusing" >&2; exit 1; fi
          git add -f data/petri/runs/ || true
          if git diff --cached --quiet; then echo "No outputs to commit"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Petri audit: $RUN_STEM (sanitised export, transcripts, manifest)"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin "$BRANCH" && git push origin HEAD:"refs/heads/$BRANCH"; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 2))
          done
          exit 1

      # Cost sidecars are spend records (model ids, token counts, ceilings, digests; never seed or model text) and
      # the ledger is the only consumer of landed spend, so a paid run books its sidecars whether or not its
      # measurement outputs are committed and whether or not a later step failed (Codex round 2: with
      # commit_outputs=false the runner destroyed them and the spend was never booked). Nothing else is staged.
      - name: Commit cost sidecars of a paid run (mode run; independent of commit_outputs)
        if: ${{ always() && needs.params.outputs.mode == 'run' }}
        env:
          BRANCH: ${{ github.ref_name }}
          RUN_STEM: run_${{ github.run_id }}_${{ github.run_attempt }}
        run: |
          set -euo pipefail
          if find data/petri -name '*.eval' | grep -q .; then echo "raw log present; refusing" >&2; exit 1; fi
          # index cleanliness is no proof the sidecars landed: the outputs step may have committed them locally and
          # then failed every push. Measure against the remote and, if local commits never reached it, fall back to
          # the remote head (the files stay in the working tree) and commit the sidecars alone (Codex round 3).
          git fetch origin "$BRANCH"
          if [ -n "$(git log --oneline "origin/$BRANCH..HEAD")" ]; then
            echo "local commit(s) never reached origin/$BRANCH; re-committing the cost sidecars alone"
            git reset --soft "origin/$BRANCH"
            git reset -q
          fi
          for f in data/petri/runs/$RUN_STEM/*.report.json; do
            if [ -f "$f" ]; then git add -f "$f"; fi
          done
          if git diff --cached --quiet; then echo "No cost sidecars to commit (already on the remote, or none written)"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Petri audit: $RUN_STEM cost sidecars"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin "$BRANCH" && git push origin HEAD:"refs/heads/$BRANCH"; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 2))
          done
          exit 1

      # The summary reports what the run wrote (scripts/petri_audit/summary.py): the parameters CI resolved, the
      # measured structure (calls, trees, branches, records, refusals, byte sizes, redaction counts, integrity), the
      # usage status per model labelled provider-measured / mock/non-metered / unavailable, and the cost sidecars.
      # It reads files only, makes no call, and reports its own gaps as `unavailable` rather than failing the job.
      # The rendered text passes the holdout seal before it reaches the job summary (`--seal-scan`): this step is
      # always(), so it runs after a rejected seal check too, and the text quotes manifest strings the seal never
      # scanned (a refusal reason carries Inspect's sample error), so a summary that would print a sealed phrase is
      # withheld in full and only the verdict is printed. The JSON under $RUNNER_TEMP is not published.
      - name: Job summary
        if: ${{ always() }}
        env:
          RUN_STEM: run_${{ github.run_id }}_${{ github.run_attempt }}
          MODE: ${{ needs.params.outputs.mode }}
          SEEDS_FILE: ${{ needs.params.outputs.seeds_file }}
          RESOLVED_PARAMS: ${{ toJSON(needs.params.outputs) }}
        run: |
          printf '%s' "$RESOLVED_PARAMS" > "$RUNNER_TEMP/resolved_params.json"
          if ! python -m scripts.petri_audit.cli run-summary --run-dir "data/petri/runs/$RUN_STEM" --mode "$MODE" \
              --raw-eval-dir "$RUNNER_TEMP/petri-run/logs" --seeds "$SEEDS_FILE" \
              --params-file "$RUNNER_TEMP/resolved_params.json" --json-out "$RUNNER_TEMP/run_summary.json" \
              --judge-started-marker "$RUNNER_TEMP/petri-run/judge_started" --seal-scan >> "$GITHUB_STEP_SUMMARY"; then
            echo "## Petri audit ($MODE, $RUN_STEM): run-summary failed; see this step's log" >> "$GITHUB_STEP_SUMMARY"
          fi
