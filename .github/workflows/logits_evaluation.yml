name: Logits Evaluation (medlang-circuits)

# Cross-model next-token behavior WITHOUT attribution graphs, for models
# Neuronpedia's circuit tracer can't render (see docs/cross-model.md). Runs the
# open weights on CPU and writes a batch_eval-compatible batch_summary so the
# frontend export merges each model into scenario.models[<model>]. No graph, no
# transcoder features - just probabilities, the language penalty, and the spread.
#
# Start it from the Actions tab (workflow_dispatch) or by pushing a params file
# to .github/trigger/logits-eval.json, e.g.
#   {"models":["qwen3-4b","qwen3-1.7b"],
#    "pairs_file":"data/simulated/pairs_20260706T201750Z.json",
#    "limit":13,"commit_outputs":true}
#
# gemma-3-4b-it is gated on Hugging Face; add an HF_TOKEN repo secret to include
# it. The Qwen models are open and need no token.
#
# Outputs land in trace_out/<pairs-file-stem>__<model>/. The trigger key
# output_root (2026-10-04, circuit-trace's pilot root carried over to this lane)
# has one other accepted value, "pilot/logits": a pairs file under pilot/ is
# measured into pilot/logits/<pairs-file-stem>__<model>/, which no collector
# reads, and only with it, and that pairs file must sit under pilot/runs/, the
# one pilot directory the eval job checks out (pilot/logits never is, so no
# cell's workspace holds an earlier pilot part). A pilot run measures next-token
# behavior only (mode logits) and is a pipeline check, never a measurement: it
# commits only its batch_summary part, and a fail-closed holdout seal check runs
# before that commit.

on:
  workflow_dispatch:
    inputs:
      models:
        description: "Space/comma-separated model ids from scripts/logits_eval.py HF_IDS (gate status: docs/model_matrix.md)"
        type: string
        default: "qwen3-4b qwen3-1.7b"
      pairs_file:
        description: "Repo path of the pairs JSON to measure"
        type: string
        default: "data/simulated/pairs_20260706T201750Z.json"
      limit:
        description: "Measure only the first N pairs (0 = all)"
        type: string
        default: "0"
      offset:
        description: "Skip the first N pairs before limit (chunking; part number = offset+1)"
        type: string
        default: "0"
      commit_outputs:
        description: "Commit the per-model batch_summary back to the branch"
        type: boolean
        default: false
      mode:
        description: "logits = next-token behavior (default); depth = per-layer logit-lens tier curves; verify = re-measure the logits numbers through interp-engine"
        type: string
        default: "logits"
      layers:
        description: "depth mode only: 'all', 'every:N', or a comma list"
        type: string
        default: "all"
      topk:
        description: "depth/verify modes: spread size (tier coverage window; verify spread depth)"
        type: string
        default: "10"
      dtype:
        description: "verify mode only: float32 (default, removes dtype as a cause) or bfloat16 (matches logits mode)"
        type: string
        default: "float32"
  push:
    paths:
      - ".github/trigger/logits-eval.json"

permissions:
  contents: write

concurrency:
  group: logits-eval-${{ github.ref }}
  cancel-in-progress: false

jobs:
  params:
    # A push that creates a ref carries created:true, and on a new ref every
    # trigger file counts as changed (2026-09-04: a merge branch fired all eight
    # lanes at once). Skip on creation; fires are pushes to existing branches.
    if: ${{ !github.event.created }}
    runs-on: ubuntu-latest
    outputs:
      models: ${{ steps.params.outputs.models }}
      pairs_file: ${{ steps.params.outputs.pairs_file }}
      limit: ${{ steps.params.outputs.limit }}
      offset: ${{ steps.params.outputs.offset }}
      commit_outputs: ${{ steps.params.outputs.commit_outputs }}
      mode: ${{ steps.params.outputs.mode }}
      layers: ${{ steps.params.outputs.layers }}
      topk: ${{ steps.params.outputs.topk }}
      dtype: ${{ steps.params.outputs.dtype }}
      output_root: ${{ steps.params.outputs.output_root }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          filter: blob:none
          sparse-checkout: |
            .github
            scripts
            data
            medlang_circuits
            docs
            ops
            tests
      - name: Resolve parameters
        id: params
        env:
          EVENT_NAME: ${{ github.event_name }}
          IN_MODELS: ${{ inputs.models }}
          IN_PAIRS_FILE: ${{ inputs.pairs_file }}
          IN_LIMIT: ${{ inputs.limit }}
          IN_OFFSET: ${{ inputs.offset }}
          IN_COMMIT_OUTPUTS: ${{ inputs.commit_outputs }}
          IN_MODE: ${{ inputs.mode }}
          IN_LAYERS: ${{ inputs.layers }}
          IN_TOPK: ${{ inputs.topk }}
          IN_DTYPE: ${{ inputs.dtype }}
        run: |
          python - <<'EOF'
          import json, os, posixpath
          defaults = {"models": "qwen3-4b qwen3-1.7b",
                      "pairs_file": "data/simulated/pairs_20260706T201750Z.json",
                      "limit": "0", "offset": "0", "commit_outputs": "false",
                      "mode": "logits", "layers": "all", "topk": "10",
                      "dtype": "float32", "output_root": ""}
          p = dict(defaults)
          if os.environ["EVENT_NAME"] == "push":
              with open(".github/trigger/logits-eval.json", encoding="utf-8") as f:
                  cfg = json.load(f)
              if isinstance(cfg.get("models"), list):
                  cfg["models"] = " ".join(str(m) for m in cfg["models"])
              p.update({k: (str(v).lower() if isinstance(v, bool) else str(v))
                        for k, v in cfg.items() if k in defaults})
          else:
              for k in defaults:
                  v = os.environ.get("IN_" + k.upper(), "")
                  if v:
                      p[k] = v
          models = [m.strip() for m in p["models"].replace(",", " ").split() if m.strip()]
          if not models:
              raise SystemExit("no models to evaluate")
          # output_root: "" keeps trace_out/<stem>__<model>; "pilot/logits" is the pilot root, which no collector reads.
          # A pairs file under pilot/ goes with the pilot root and only with it, under that root it must sit under
          # pilot/runs/ (the one pilot directory the eval job checks out), and a pilot run is mode logits only.
          # scripts/fire_trigger.py (logits_eval_params_problems) refuses the same before a fire is journaled; a
          # workflow_dispatch has no output_root input, so it keeps "". Every check runs before any output is written.
          root = p["output_root"]
          if root not in ("", "pilot/logits"):
              raise SystemExit(f"output_root {root!r}: only '' (trace_out) or 'pilot/logits' is accepted")
          pairs_path = p["pairs_file"]
          if "\\" in pairs_path:
              # posixpath reads a backslash as part of a file name, so the pilot/ and absolute-path tests below would
              # not see a Windows spelling (pilot\runs\x.json, C:\...)
              raise SystemExit(f"pairs_file {pairs_path!r} contains a backslash; give a repo-relative path "
                               "with / separators")
          norm_pairs = posixpath.normpath(pairs_path)
          if norm_pairs.startswith("/") or norm_pairs == ".." or norm_pairs.startswith("../"):
              # an absolute or ..-escaping path can name pilot/ without the pilot/ prefix tested below
              raise SystemExit(f"pairs_file {pairs_path!r} is absolute or leaves the checkout; "
                               "give a repo-relative path")
          if root != "pilot/logits" and norm_pairs.startswith("pilot/"):
              raise SystemExit(f"pairs_file {pairs_path!r} is under pilot/: pilot pairs are measured only with "
                               "output_root 'pilot/logits', so their outputs never enter trace_out/")
          if root == "pilot/logits":
              refused = []
              if not norm_pairs.startswith("pilot/runs/"):
                  # the eval job checks out pilot/runs and never pilot/logits, so pilot pairs are read from there only
                  refused.append(f"pairs_file {pairs_path!r} is not under pilot/runs/")
              if "," in pairs_path:  # the seal step's --extra list splits on commas
                  refused.append(f"pairs_file {pairs_path!r} contains a comma")
              if p["mode"] != "logits":  # depth and verify write other files, under trace_out/ names
                  refused.append(f"mode {p['mode']!r}")
              if refused:
                  raise SystemExit("output_root 'pilot/logits' measures next-token behavior (mode 'logits') only, "
                                   "from a pairs file under pilot/runs/; refused: " + "; ".join(refused))
          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a", encoding="utf-8") as f:
              f.write("models=" + json.dumps(models) + "\n")
              f.write("pairs_file=" + p["pairs_file"] + "\n")
              f.write("limit=" + p["limit"] + "\n")
              f.write("offset=" + p["offset"] + "\n")
              f.write("commit_outputs=" + p["commit_outputs"] + "\n")
              f.write("mode=" + p["mode"] + "\n")
              f.write("layers=" + p["layers"] + "\n")
              f.write("topk=" + p["topk"] + "\n")
              f.write("dtype=" + p["dtype"] + "\n")
              f.write("output_root=" + root + "\n")
          if p["mode"] not in ("logits", "depth", "verify"):
              raise SystemExit("mode must be 'logits', 'depth' or 'verify', got " + repr(p["mode"]))
          print("models:", models, "| pairs:", p["pairs_file"], "| mode:", p["mode"],
                "| limit:", p["limit"], "| offset:", p["offset"], "| layers:", p["layers"],
                "| output_root:", repr(root))
          EOF

  eval:
    if: ${{ !github.event.created }}
    needs: params
    runs-on: ubuntu-latest
    # CPU inference on a 4B model runs ~1 min/pair; a 120-pair batch needs
    # a few hours of headroom.
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        model: ${{ fromJson(needs.params.outputs.models) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          filter: blob:none
          # pilot/runs, not all of pilot/: a pilot cell reads its pairs file from there, while pilot/logits stays out
          # as trace_out/ does, so neither root's OUT_DIR starts with earlier committed parts in it; the commit step
          # stages this cell's new part outside the sparse checkout with `git add --sparse`, for both roots
          sparse-checkout: |
            .github
            scripts
            data
            medlang_circuits
            docs
            ops
            tests
            pilot/runs
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install CPU torch + transformers
        run: |
          pip install --quiet -c constraints.txt torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet -c constraints.txt transformers accelerate

      # Eager backend only. interp-engine keeps vLLM out of its base deps so the
      # core installs without CUDA (docs/interp_engine_assessment.md section 1);
      # asking for [vllm] here would pull GB of CUDA wheels onto a CPU runner.
      - name: Install interp-engine (depth and verify modes)
        if: ${{ needs.params.outputs.mode == 'depth' || needs.params.outputs.mode == 'verify' }}
        run: |
          pip install --quiet -c constraints.txt interp-engine
          python -c "import interp_engine, torch; print('interp-engine', interp_engine.__version__, '| torch', torch.__version__, '| cuda', torch.cuda.is_available())"

      # 7B/9B models exceed runner RAM during load (exit 137 on the 07-11
      # probe); the same swap provision that fixed the patching workflow.
      - name: Provision swap for large-model load
        run: |
          sudo fallocate -l 12G /mnt/logits-swapfile
          sudo chmod 600 /mnt/logits-swapfile
          sudo mkswap /mnt/logits-swapfile
          sudo swapon /mnt/logits-swapfile
          free -h

      - name: Resolve output dir
        env:
          MODEL: ${{ matrix.model }}
          PAIRS_FILE: ${{ needs.params.outputs.pairs_file }}
          OFFSET: ${{ needs.params.outputs.offset }}
          MODE: ${{ needs.params.outputs.mode }}
          TOPK: ${{ needs.params.outputs.topk }}
          OUTPUT_ROOT: ${{ needs.params.outputs.output_root }}
        run: |
          STEM=$(basename "$PAIRS_FILE" .json)
          PART=$(printf 'part_%02d' $((OFFSET + 1)))
          echo "PART=$PART" >> "$GITHUB_ENV"
          if [ "$OUTPUT_ROOT" = "pilot/logits" ]; then
            # pilot pairs: outside trace_out/, where every collector reads measurements; the params job admits only
            # mode logits under this root, so the summary is always a batch_summary part
            if [ "$MODE" != "logits" ]; then
              echo "output_root pilot/logits measures mode logits only, not $MODE"; exit 1
            fi
            echo "OUT_DIR=pilot/logits/${STEM}__${MODEL}" >> "$GITHUB_ENV"
            echo "SUMMARY_FILE=batch_summary.$PART.json" >> "$GITHUB_ENV"
            exit 0
          elif [ -n "$OUTPUT_ROOT" ]; then
            # the params job admits only these two
            echo "output_root $OUTPUT_ROOT: only '' or 'pilot/logits' is accepted"; exit 1
          fi
          if [ "$MODE" = "depth" ]; then
            # separate dir: a depth probe is a different instrument from the
            # behavioral run and must not merge into the same batch_summary set
            echo "OUT_DIR=trace_out/depth_k${TOPK}_${STEM}__${MODEL}" >> "$GITHUB_ENV"
            echo "SUMMARY_FILE=depth_probe.$PART.json" >> "$GITHUB_ENV"
          elif [ "$MODE" = "verify" ]; then
            # separate dir AND a non-batch_summary filename: a verification run
            # re-measures numbers the logits lane already published, and must
            # never be collected as a second measurement of the same pairs
            echo "OUT_DIR=trace_out/verify_${STEM}__${MODEL}" >> "$GITHUB_ENV"
            echo "SUMMARY_FILE=verify_summary.$PART.json" >> "$GITHUB_ENV"
          else
            echo "OUT_DIR=trace_out/${STEM}__${MODEL}" >> "$GITHUB_ENV"
            echo "SUMMARY_FILE=batch_summary.$PART.json" >> "$GITHUB_ENV"
          fi

      - name: Measure next-token behavior
        if: ${{ needs.params.outputs.mode == 'logits' }}
        env:
          MODEL: ${{ matrix.model }}
          PAIRS_FILE: ${{ needs.params.outputs.pairs_file }}
          LIMIT: ${{ needs.params.outputs.limit }}
          OFFSET: ${{ needs.params.outputs.offset }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}   # only needed for gated models (gemma)
        run: |
          python scripts/logits_eval.py --pairs "$PAIRS_FILE" --model "$MODEL" \
            --out "$OUT_DIR" --limit "$LIMIT" --offset "$OFFSET"

      - name: Measure per-layer tier curves (depth mode)
        if: ${{ needs.params.outputs.mode == 'depth' }}
        env:
          MODEL: ${{ matrix.model }}
          PAIRS_FILE: ${{ needs.params.outputs.pairs_file }}
          LIMIT: ${{ needs.params.outputs.limit }}
          OFFSET: ${{ needs.params.outputs.offset }}
          LAYERS: ${{ needs.params.outputs.layers }}
          TOPK: ${{ needs.params.outputs.topk }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}   # only needed for gated models (gemma)
        run: |
          PYTHONPATH=scripts python scripts/depth_probe.py --pairs "$PAIRS_FILE" \
            --model "$MODEL" --out "$OUT_DIR" --limit "$LIMIT" --offset "$OFFSET" \
            --layers "$LAYERS" --topk "$TOPK" --tiers data/urgency_tiers.draft.json

      - name: Re-measure the same prompts through interp-engine (verify mode)
        if: ${{ needs.params.outputs.mode == 'verify' }}
        env:
          MODEL: ${{ matrix.model }}
          PAIRS_FILE: ${{ needs.params.outputs.pairs_file }}
          LIMIT: ${{ needs.params.outputs.limit }}
          OFFSET: ${{ needs.params.outputs.offset }}
          TOPK: ${{ needs.params.outputs.topk }}
          DTYPE: ${{ needs.params.outputs.dtype }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}   # only needed for gated models (gemma)
        run: |
          PYTHONPATH=scripts python scripts/verify_probs.py --pairs "$PAIRS_FILE" \
            --model "$MODEL" --out "$OUT_DIR" --limit "$LIMIT" --offset "$OFFSET" \
            --topk "$TOPK" --dtype "$DTYPE"

      # Pilot root only: pilot pairs come from the pilot generator, not the study's batches, so everything this cell
      # wrote and the pairs file it read are swept for sealed holdout phrases before anything is committed (the
      # circuit-trace pilot seal step and petri_audit.yml's pattern: no site checkout, the sealed set computed from
      # data/ and ops/). The sweep reads a copy of OUT_DIR under $RUNNER_TEMP, not OUT_DIR in place: OUT_DIR is outside
      # the sparse checkout, so once an earlier fire has committed a part there git marks that part skip-worktree, and
      # seal_check.py refuses any root holding such a file (exit 2), which would block every later chunk of the same
      # pairs file. The copy holds exactly the files this cell wrote, the part the commit step stages among them. Runs
      # after a failed measurement too, as the commit step does, so a partial part is checked before it lands; the
      # commit and run-page summary steps below act on a pilot cell only when this step succeeded.
      - name: Holdout seal check over the pilot logits outputs (pilot root only; fails closed)
        id: seal
        if: ${{ always() && needs.params.outputs.output_root == 'pilot/logits' }}
        env:
          PAIRS_FILE: ${{ needs.params.outputs.pairs_file }}
        run: |
          set -euo pipefail
          # seal_check.py reads a root that does not exist as zero files and passes, so a pairs file that is not
          # there fails here rather than letting the check pass over nothing (a comma in the name is refused at fire
          # time and in the params job for the same reason: --extra splits on commas)
          test -f "$PAIRS_FILE" || { echo "pilot seal check: pairs file $PAIRS_FILE not found"; exit 1; }
          SEAL_COPY="$RUNNER_TEMP/pilot-logits-seal"
          rm -rf "$SEAL_COPY"
          mkdir -p "$SEAL_COPY"
          if [ -d "$OUT_DIR" ]; then
            cp -R "$OUT_DIR/." "$SEAL_COPY/"
          fi
          python scripts/seal_check.py --site "$RUNNER_TEMP/no-site" --extra "$SEAL_COPY,$PAIRS_FILE"

      - name: Commit the per-model summary to the branch
        if: ${{ always() && needs.params.outputs.commit_outputs == 'true' && (needs.params.outputs.output_root != 'pilot/logits' || steps.seal.outcome == 'success') }}
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ ! -f "$OUT_DIR/$SUMMARY_FILE" ]; then
            echo "No summary to commit"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse -f "$OUT_DIR/$SUMMARY_FILE"
          git commit -m "Logits eval (${{ needs.params.outputs.mode }}): $OUT_DIR (${{ matrix.model }})"
          for i in 1 2 3 4 5; do
            # -X theirs: during rebase "theirs" is the run's own commit, so a
            # shared status file resolves last-writer-wins instead of stranding
            # the measured outputs on the runner (jlens chunk-3 loss, 2026-07-15).
            # Part files have unique names and never conflict.
            if git pull --rebase -X theirs origin "$BRANCH" && git push origin HEAD:"refs/heads/$BRANCH"; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 2))
          done
          exit 1

      # Under the pilot root the run page is a publication too, so a pilot cell whose seal check did not succeed does
      # not print its summary there; the default root is unchanged.
      - name: Job summary
        if: ${{ always() && (needs.params.outputs.output_root != 'pilot/logits' || steps.seal.outcome == 'success') }}
        run: |
          SUMMARY="$OUT_DIR/$SUMMARY_FILE"
          if [ -f "$SUMMARY" ]; then
            {
              echo "## ${{ needs.params.outputs.mode }} eval (${{ matrix.model }})"
              echo '```'
              python - "$SUMMARY" <<'EOF'
          import json, sys
          s = json.load(open(sys.argv[1]))
          depth = s.get("mode") == "depth_probe"
          for r in s["results"]:
              if depth:
                  print(f"pair {r['index']:2d}  first_divergence={r['first_divergence_layer']}  "
                        f"final_gap={r['final_gap']}  max_abs_gap={r['max_abs_gap']}  "
                        f"informative={r['layers_informative']}/{r['layers_measured']}")
              else:
                  print(f"pair {r['index']:2d}  clin={r['probabilities']['clinical']}  "
                        f"pat={r['probabilities']['patient']}  penalty={r['language_penalty']}")
          EOF
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
