name: Circuit Trace Evaluation (medlang-circuits)

# Benchmarks the TRACED model (hosted attribution-graph generation) - the
# companion Model Evaluation workflow benchmarks the Anthropic translation
# models instead. Hosted generation takes minutes per graph, so keep
# per-chunk sample sizes small; large batches fan out as a matrix of
# chunks (one job per offset, max 3 in parallel).
#
# Two ways to start a run:
#   - workflow_dispatch from the Actions tab, parameters as form inputs;
#   - push a parameters file to .github/trigger/circuit-trace.json (same
#     keys as the dispatch inputs; "offsets" may be a list). This lets
#     automation with contents-write access but no actions-write scope
#     start runs and chain chunked tracing over one batch with global
#     output numbering and per-chunk committed checkpoints.
#
# Outputs land in trace_out/<pairs-file-stem>/ so different batches never
# collide on index numbering. The trigger key output_root (2026-10-01) has one
# other accepted value, "pilot/traces": a pairs file under pilot/ is traced
# into pilot/traces/<run_id>/<pairs-file-stem>/ (the run's own folder since
# 2026-10-05; <run_id> is the directory directly under pilot/runs/), which no
# collector reads, and only with it, and that pairs file must sit under
# pilot/runs/, the one pilot directory either job checks out (pilot/traces
# never is, so no cell's workspace holds an earlier pilot part), in its run's
# trace/ directory, and be named for its run with no "__" in its name,
# pilot/runs/<run_id>/trace/<run_id>_<name>.json (2026-10-04). Run
# 2's and run 3's parts landed flat, at pilot/traces/trace_pairs/ and
# pilot/traces/pilot_v3_20261004_trace_pairs/, and stay there; a run id of
# either name is refused. A pilot trace is a $0 plain pipeline
# check, never a measurement: the params job refuses
# show_mitigation, mode translation, steering and generate_explanations under
# it, it commits only the summary parts, and a fail-closed holdout seal check
# runs before that commit.
#
# The key source_set (2026-10-09) names the Neuronpedia graph source set to trace
# with (medlang-batch-eval --source-set: the hosted request's sourceSetName, and
# the set features are tagged from). Absent or "" passes no --source-set, so the
# server applies the model's default set, as every fire before the key did;
# gemma-3-4b-it has no default ("Source Set Missing", run 37960184793) and traces
# only with one. The params job refuses a value that is not a short lower-case
# slug, a source set with more than one graph model, and a source set with
# commit_outputs true under either root: trace_out/ summaries naming a source set
# feed scripts/export_tag_mass.py, and a pilot part's path does not name the set,
# so another set's fire would replace it (scripts/fire_trigger.py
# circuit_trace_source_set_problems refuses the same at a fire).

on:
  workflow_dispatch:
    inputs:
      graph_model:
        description: "Model to trace (hosted graph generation; non-gemma models need a source-set default registered first)"
        type: choice
        default: gemma-2-2b
        options:
          - gemma-2-2b
          - gemma-3-4b-it
          - qwen3-4b
          - qwen3-1.7b
      mode:
        description: "Visualization mode (selects the committed sample pairs file)"
        type: choice
        default: 2panel
        options:
          - 2panel
          - 4quadrant
          - translation
          - dialect
      pairs_file:
        description: "Repo path of the pairs JSON to trace (empty = the committed ci_pairs sample for the mode)"
        type: string
        default: ""
      offsets:
        description: "Comma-separated pair offsets; one matrix trace job per offset (max 3 parallel), numbering stays global"
        type: string
        default: "0"
      sample_size:
        description: "Pairs to trace per offset (hosted generation takes minutes per graph)"
        type: string
        default: "1"
      show_mitigation:
        description: "(2panel) Trace a third panel: the patient sentence LLM-translated to clinical wording (uses ANTHROPIC_API_KEY)"
        type: boolean
        default: false
      source_set:
        description: "Neuronpedia graph source set (sourceSetName; lower-case slug, one model only; '' = the model's server default)"
        type: string
        default: ""
      screen_targets:
        description: "(2panel) Screen pairs: the intended target must reach this probability on the clinical side; screened-out pairs skip the patient trace but stay recorded ('' = off)"
        type: string
        default: ""
      commit_outputs:
        description: "Commit index_NN html/png + the summary part back to the dispatched branch (checkpointing)"
        type: boolean
        default: false
      max_n_logits:
        description: "Salient logits to trace (int 5-15)"
        type: string
        default: "10"
      desired_logit_prob:
        description: "Cumulative logit probability to cover (0.6-0.99)"
        type: string
        default: "0.95"
      node_threshold:
        description: "Node pruning threshold (0.5-0.95)"
        type: string
        default: "0.8"
      edge_threshold:
        description: "Edge pruning threshold (0.65-0.98)"
        type: string
        default: "0.98"
      max_feature_nodes:
        description: "Feature node cap (int 1500-10000)"
        type: string
        default: "5000"
  push:
    paths:
      - ".github/trigger/circuit-trace.json"

permissions:
  contents: write

# One run at a time per branch; the matrix parallelizes chunks inside a run.
concurrency:
  group: circuit-trace-${{ github.ref }}
  cancel-in-progress: false

jobs:
  params:
    # A push that creates a ref carries created:true, and on a new ref every
    # trigger file counts as changed (2026-09-04: a merge branch fired all eight
    # lanes at once). Skip on creation; fires are pushes to existing branches.
    if: ${{ !github.event.created }}
    runs-on: ubuntu-latest
    outputs:
      config: ${{ steps.params.outputs.config }}
      offsets: ${{ steps.params.outputs.offsets }}
      models: ${{ steps.params.outputs.models }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          filter: blob:none
          # the daily-ceiling gate reads the journal at github.event.before to find the entry this push added for
          # this fire, and a depth-1 clone has no commit to read it at; blobless keeps full history cheap
          # (petri_audit.yml's pattern, G4 2026-09-23)
          fetch-depth: 0
          # pilot/runs, not all of pilot/: pilot-root pairs files live there (screen_targets reads one below), and
          # pilot/traces, where earlier pilot parts are committed, stays out of the checkout as trace_out/ does
          sparse-checkout: |
            .github
            scripts
            data
            medlang_circuits
            docs
            ops
            tests
            pilot/runs

      - name: Resolve run parameters
        id: params
        env:
          EVENT_NAME: ${{ github.event_name }}
          IN_GRAPH_MODEL: ${{ inputs.graph_model }}
          IN_MODE: ${{ inputs.mode }}
          IN_PAIRS_FILE: ${{ inputs.pairs_file }}
          IN_OFFSETS: ${{ inputs.offsets }}
          IN_SAMPLE_SIZE: ${{ inputs.sample_size }}
          IN_SCREEN_TARGETS: ${{ inputs.screen_targets }}
          IN_SOURCE_SET: ${{ inputs.source_set }}
          IN_SHOW_MITIGATION: ${{ inputs.show_mitigation }}
          IN_COMMIT_OUTPUTS: ${{ inputs.commit_outputs }}
          IN_MAX_N_LOGITS: ${{ inputs.max_n_logits }}
          IN_DESIRED_LOGIT_PROB: ${{ inputs.desired_logit_prob }}
          IN_NODE_THRESHOLD: ${{ inputs.node_threshold }}
          IN_EDGE_THRESHOLD: ${{ inputs.edge_threshold }}
          IN_MAX_FEATURE_NODES: ${{ inputs.max_feature_nodes }}
        run: |
          python - <<'EOF'
          import json, os, posixpath, re
          defaults = {
              "graph_model": "gemma-2-2b", "graph_models": "", "mode": "2panel",
              "pairs_file": "", "offsets": "0", "sample_size": "1",
              "screen_targets": "", "show_mitigation": "false", "commit_outputs": "false",
              "max_n_logits": "10", "desired_logit_prob": "0.95",
              "node_threshold": "0.8", "edge_threshold": "0.98",
              "max_feature_nodes": "5000", "generate_explanations": "0",
              "steer_validate": "0", "steer_boost": "0", "steer_placebo": "0",
              "steer_strength": "", "steer_boost_strength": "", "steer_rank_offset": "",
              "translation_model": "", "translation_placebo": "0",
              "output_root": "", "source_set": "",
          }
          params = dict(defaults)
          if os.environ["EVENT_NAME"] == "push":
              with open(".github/trigger/circuit-trace.json", encoding="utf-8") as f:
                  overrides = json.load(f)
              if "offset" in overrides and "offsets" not in overrides:  # legacy key
                  overrides["offsets"] = overrides.pop("offset")
              if isinstance(overrides.get("offsets"), list):
                  overrides["offsets"] = ",".join(str(o) for o in overrides["offsets"])
              if isinstance(overrides.get("graph_models"), list):
                  overrides["graph_models"] = ",".join(str(m) for m in overrides["graph_models"])
              params.update({k: str(v).lower() if isinstance(v, bool) else str(v)
                             for k, v in overrides.items() if k in defaults})
          else:
              for key in defaults:
                  value = os.environ.get("IN_" + key.upper(), "")
                  if value:
                      params[key] = value
          # A value carrying a newline (or any control character, as fire_trigger.control_char_values reads one) is
          # refused on both paths before any check below reads a value. The outputs below are JSON, which escapes one,
          # but "Select sample pairs" writes OUT_DIR=<folder> to $GITHUB_ENV from the pairs file's name, where a
          # newline adds lines of its own and the last OUT_DIR wins. A dispatch never passes through
          # scripts/fire_trigger.py, which refuses the same characters at a fire (logits_evaluation.yml's params job
          # refuses them too).
          for key, value in params.items():
              if any(ord(c) < 32 or ord(c) == 127 for c in value):
                  raise SystemExit(f"{key} must not carry a control character (newline, carriage return, tab), "
                                   f"got {value!r}")
          offsets = sorted({int(x) for x in params["offsets"].replace(",", " ").split()})
          if not offsets:
              raise SystemExit("no offsets to trace")
          # source_set: "" passes no --source-set (the model's server default). Any other value reaches the run step's
          # command line, so it must be a slug that cannot read as an option (fire_trigger.py
          # CIRCUIT_TRACE_SOURCE_SET_RE); the one-model and trace_out-commit rules follow the models below.
          source_set = params["source_set"]
          if source_set and not re.fullmatch(r"[a-z0-9][a-z0-9-]{0,63}", source_set):
              raise SystemExit(f"source_set {source_set!r}: a source set is a lower-case slug (a letter or digit, "
                               "then letters, digits or hyphens, at most 64 characters)")
          # output_root: "" keeps trace_out/<stem>; "pilot/traces" is the pilot root, which no collector reads, and
          # each run traces into its own folder there, pilot/traces/<run_id>/<stem>[__<model>] (2026-10-05). A
          # pairs file under pilot/ goes with the pilot root and only with it, under that root it must sit under
          # pilot/runs/ (the one pilot directory either job checks out), and a pilot trace is $0 and plain.
          # scripts/fire_trigger.py (circuit_trace_params_problems, circuit_trace_pilot_source_problems) refuses
          # the same before a fire is journaled; a workflow_dispatch has no output_root input, so it keeps "".
          root = params["output_root"]
          if root not in ("", "pilot/traces"):
              raise SystemExit(f"output_root {root!r}: only '' (trace_out) or 'pilot/traces' is accepted")
          pairs_path = params["pairs_file"] or f"medlang_circuits/data/ci_pairs_{params['mode']}.json"
          if "\\" in pairs_path:
              # posixpath reads a backslash as part of a file name, so the pilot/ and absolute-path tests below would
              # not see a Windows spelling (pilot\runs\x.json, C:\...); every pairs_file fired to date uses /
              raise SystemExit(f"pairs_file {pairs_path!r} contains a backslash; give a repo-relative path "
                               "with / separators")
          norm_pairs = posixpath.normpath(pairs_path)
          if norm_pairs.startswith("/") or norm_pairs == ".." or norm_pairs.startswith("../"):
              # an absolute or ..-escaping path can name pilot/ without the pilot/ prefix tested below
              raise SystemExit(f"pairs_file {pairs_path!r} is absolute or leaves the checkout; "
                               "give a repo-relative path")
          in_pilot = norm_pairs.startswith("pilot/")
          if root != "pilot/traces" and in_pilot:
              raise SystemExit(f"pairs_file {pairs_path!r} is under pilot/: pilot pairs trace only with "
                               "output_root 'pilot/traces', so their outputs never enter trace_out/")
          if root == "pilot/traces":
              refused = []
              if not norm_pairs.startswith("pilot/runs/"):
                  # both jobs check out pilot/runs and never pilot/traces, so pilot pairs trace from there only
                  refused.append(f"pairs_file {pairs_path!r} is not under pilot/runs/")
              else:
                  # the run id is the directory directly under pilot/runs/, and the select step below traces into
                  # pilot/traces/<run_id>/<stem>[__<model>], so two runs never share a folder. Within the run, the
                  # file sits at exactly pilot/runs/<run_id>/trace/<file> (where pilot/analysis/trace_pairs.py writes
                  # it), so two of its files never share a stem; it is named for its run,
                  # pilot/runs/<run_id>/trace/<run_id>_<name>.json (2026-10-04), so the folder's name says which run
                  # it holds; its name holds no "__", which the select step puts between a stem and a model; and a
                  # run id that names a flat folder written before 2026-10-05 (run 2's pilot/traces/trace_pairs/, run
                  # 3's pilot/traces/pilot_v3_20261004_trace_pairs/) is refused, since the run would trace into it
                  # (fire_trigger.py pilot_pairs_location_problem, pilot_pairs_run_name_problem,
                  # pilot_pairs_separator_problem and pilot_legacy_run_id_problem; logits_evaluation.yml applies the
                  # same tests)
                  parts = norm_pairs.split("/")
                  run_id = parts[2] if len(parts) == 5 and parts[3] == "trace" else ""
                  name = posixpath.basename(pairs_path)
                  if not run_id:
                      refused.append(f"pairs_file {pairs_path!r} is not in its run's trace/ directory "
                                     "(pilot/runs/<run_id>/trace/<run_id>_<name>.json)")
                  elif not (name.startswith(run_id + "_") and name.endswith(".json")
                            and len(name) > len(run_id) + len("_.json")):
                      refused.append(f"pairs_file {pairs_path!r} is not named for its run "
                                     "(pilot/runs/<run_id>/trace/<run_id>_<name>.json; for run 2's legacy "
                                     "trace/trace_pairs.json, re-run pilot/analysis/trace_pairs.py --run-dir "
                                     "pilot/runs/pilot_v2_20261002 --review-sample, whose default writes a "
                                     "byte-identical pilot/runs/pilot_v2_20261002/trace/"
                                     "pilot_v2_20261002_trace_pairs.json, or copy the file there)")
                  elif "__" in name:
                      refused.append(f"pairs_file {pairs_path!r} holds '__' in its name, which the select step "
                                     "puts between a stem and a model")
                  elif run_id in ("trace_pairs", "pilot_v3_20261004_trace_pairs"):
                      refused.append(f"run id {run_id!r} is the name of the pilot output folder "
                                     f"pilot/traces/{run_id}/ written before 2026-10-05")
              if "," in pairs_path:  # the seal step's --extra list splits on commas
                  refused.append(f"pairs_file {pairs_path!r} contains a comma")
              if params["show_mitigation"].strip().lower() not in ("", "false", "0"):
                  refused.append(f"show_mitigation {params['show_mitigation']!r}")
              if params["mode"].strip().lower() == "translation":
                  refused.append(f"mode {params['mode']!r}")
              for key in ("generate_explanations", "steer_validate", "steer_boost", "steer_placebo"):
                  if params[key] not in ("", "0"):  # the run step passes any other value on
                      refused.append(f"{key} {params[key]!r}")
              if refused:
                  raise SystemExit("output_root 'pilot/traces' is a $0 plain trace; refused: " + "; ".join(refused))
              if params["screen_targets"]:
                  # screening measures each pair's target_clinical_token; a pair without one is always screened
                  # out and its patient side never traced
                  with open(pairs_path, encoding="utf-8") as f:
                      pairs = json.load(f)
                  if not isinstance(pairs, list):
                      raise SystemExit(f"{pairs_path} is not a JSON array")
                  size = int(params["sample_size"])
                  missing = sorted({o + i + 1 for o in offsets for i, pair in enumerate(pairs[o:o + size])
                                    if not (isinstance(pair, dict) and pair.get("target_clinical_token"))})
                  if missing:
                      raise SystemExit(f"screen_targets refused: {len(missing)} selected pair(s) of {pairs_path} "
                                       f"carry no target_clinical_token (1-based indices {missing[:10]})")
          # graph_models (list/space/comma) fans the trace out over models; "all"
          # expands to every hosted model. Falls back to the single graph_model,
          # so a legacy single-model trigger behaves exactly as before.
          raw = params.get("graph_models") or params["graph_model"]
          models = [m.strip() for m in str(raw).replace(",", " ").split() if m.strip()]
          if "all" in models:
              models = ["gemma-2-2b", "gemma-3-4b-it", "qwen3-4b", "qwen3-1.7b"]
          if not models:
              models = [params["graph_model"]]
          if source_set:
              # a source set belongs to one model, and the matrix passes it to every cell
              if len(models) > 1:
                  raise SystemExit(f"source_set {source_set!r} with {len(models)} graph models {models}: fire each "
                                   "model on its own")
              # under either root: scripts/export_tag_mass.py aggregates clinical_mass from every trace_out/ summary
              # naming a source set, and a pilot part's path (<run_id>/<stem>[__<model>]/part_NN) does not name the
              # set, so a fire with another set would replace it
              if params["commit_outputs"].strip().lower() == "true":
                  raise SystemExit(f"source_set {source_set!r} with commit_outputs true is refused under either root "
                                   "(trace_out/ would publish uncalibrated clinical mass; a pilot part would be "
                                   "replaced by another set's fire); use commit_outputs false")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("config=" + json.dumps(params) + "\n")
              out.write("offsets=" + json.dumps(offsets) + "\n")
              out.write("models=" + json.dumps(models) + "\n")
          print(json.dumps(params, indent=2))
          print("offsets:", offsets)
          print("models:", models)
          EOF

      # The two paths of this lane that call Anthropic: 2panel's --show-mitigation third panel, and mode translation,
      # which LLM-translates every pair before tracing it. Every other trace is $0 and skips this step. The condition
      # covers every config under which the run step spends (MITIGATE exactly "true", or mode exactly "translation";
      # an expression's == ignores case, so it is a superset), and fire_trigger's is_paid_fire decides inside the
      # gate: both paths carry no max_spend, so it prices each fire at MITIGATION_IMPUTED_USD.
      # tests/test_fire_trigger.py holds this condition to is_paid_fire.
      - name: Daily-ceiling gate (server-side; show_mitigation or mode translation)
        if: ${{ fromJson(steps.params.outputs.config).show_mitigation == 'true' || fromJson(steps.params.outputs.config).mode == 'translation' }}
        env:
          GATE_PARAMS: ${{ steps.params.outputs.config }}
          # the ref's tip BEFORE this push, and the ref: the gate leaves out of the day's held sum the one journal
          # entry this push added for this fire on this branch, so its commitment is counted once, not twice (G4,
          # 2026-09-23). A workflow_dispatch has no previous tip; then nothing is left out, as before
          PUSH_BEFORE: ${{ github.event.before }}
          REF_NAME: ${{ github.ref_name }}
          # ...and only on attempt 1: an Actions-tab re-run reuses the push event, so on a later attempt the
          # entry stands for the first attempt's commitment and keeps counting beside this one's
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          printf '%s' "$GATE_PARAMS" > "$RUNNER_TEMP/gate_params.json"
          python3 scripts/fire_trigger.py budget-gate --trigger circuit-trace --params-file "$RUNNER_TEMP/gate_params.json" --push-before "$PUSH_BEFORE" --ref "$REF_NAME" --run-attempt "$RUN_ATTEMPT"

  trace:
    if: ${{ !github.event.created }}
    needs: params
    runs-on: ubuntu-latest
    # 45 was tight: hosted-API latency variance killed 5-pair chunks mid-pair
    # four times on 2026-07-13 (conclusion 'cancelled', truncated final pair).
    # Incremental commits make a longer ceiling cheap.
    # 2026-07-28 (owner-approved): 75 -> 300. The 75-minute ceiling was the ONLY
    # thing ending runs — there is no wall-clock budget inside the tracer — so
    # every run stopped at ~10 pairs and the backfill advanced one short window
    # at a time. Each hand-off between runs is where the lane goes idle (49.7 of
    # 90.9 hours were idle over 2026-07-24..27, always BETWEEN runs, never
    # during one: the run is server-side and survives container reclaims that
    # kill the driving session). Fewer, longer runs therefore mean fewer
    # opportunities to stall. Safe because outputs commit incrementally: a run
    # that dies at any point keeps every pair it finished. GitHub's job ceiling
    # is 360 minutes; 300 leaves headroom for checkout/install/commit/upload.
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        model: ${{ fromJson(needs.params.outputs.models) }}
        offset: ${{ fromJson(needs.params.outputs.offsets) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          filter: blob:none
          # pilot/runs, not all of pilot/: a pilot cell reads its pairs file from there, while pilot/traces stays out
          # as trace_out/ does, so neither root's OUT_DIR starts with earlier committed parts in it and the commit
          # step's rebase does not write other cells' parts into it; that step stages this cell's new part outside
          # the sparse checkout with `git add --sparse`, for both roots
          sparse-checkout: |
            .github
            scripts
            data
            medlang_circuits
            docs
            ops
            tests
            pilot/runs

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install package with LLM extras
        run: pip install ".[llm]" -c constraints.txt

      - name: Select sample pairs
        env:
          MODE: ${{ fromJson(needs.params.outputs.config).mode }}
          SAMPLE_SIZE: ${{ fromJson(needs.params.outputs.config).sample_size }}
          PAIRS_FILE: ${{ fromJson(needs.params.outputs.config).pairs_file }}
          OUTPUT_ROOT: ${{ fromJson(needs.params.outputs.config).output_root }}
          GRAPH_MODEL: ${{ matrix.model }}
          OFFSET: ${{ matrix.offset }}
        run: |
          python - <<'EOF'
          import json, os, posixpath
          mode, n = os.environ["MODE"], int(os.environ["SAMPLE_SIZE"])
          offset = int(os.environ["OFFSET"])
          path = os.environ["PAIRS_FILE"] or f"medlang_circuits/data/ci_pairs_{mode}.json"
          with open(path, encoding="utf-8") as f:
              pairs = json.load(f)
          selected = pairs[offset:offset + n]
          if not selected:
              raise SystemExit(f"offset {offset} is past the end of {path} ({len(pairs)} pairs)")
          with open("ci_pairs.json", "w", encoding="utf-8") as f:
              json.dump(selected, f, indent=2)
          stem = os.path.splitext(os.path.basename(path))[0]
          model = os.environ.get("GRAPH_MODEL", "gemma-2-2b")
          if model != "gemma-2-2b":  # cross-model runs get their own dir
              stem = f"{stem}__{model}"
          root = os.environ.get("OUTPUT_ROOT", "")
          if root == "":
              out_dir = f"trace_out/{stem}"
          elif root == "pilot/traces":  # pilot pairs: outside trace_out/, where every collector reads
              # in the run's own folder (2026-10-05): the run id is the directory directly under pilot/runs/ of the
              # normalised path, read as the params job reads it (fire_trigger.py pilot_run_id), so two runs whose
              # pairs files share a stem (runs a and a_b each owning a_b_pairs.json) never write one folder
              parts = posixpath.normpath(path).split("/")
              run_id = parts[2] if len(parts) >= 4 and parts[:2] == ["pilot", "runs"] else ""
              if not run_id:  # the params job admits no such path
                  raise SystemExit(f"pilot pairs file {path!r} is not under pilot/runs/<run_id>/")
              out_dir = f"pilot/traces/{run_id}/{stem}"
          else:  # the params job admits only these two
              raise SystemExit(f"output_root {root!r}: only '' or 'pilot/traces' is accepted")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"OUT_DIR={out_dir}\n")
          print(f"Selected pairs {offset + 1}-{offset + len(selected)} of {len(pairs)} "
                f"from {path} -> {out_dir}")
          EOF

      - name: Run batch evaluation against the hosted backend
        env:
          NEURONPEDIA_API_KEY: ${{ secrets.NEURONPEDIA_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}  # mode translation and show_mitigation only
          OFFSET: ${{ matrix.offset }}
          SCREEN: ${{ fromJson(needs.params.outputs.config).screen_targets }}
          MITIGATE: ${{ fromJson(needs.params.outputs.config).show_mitigation }}
          GEN_EXPL: ${{ fromJson(needs.params.outputs.config).generate_explanations }}
          STEER_VALIDATE: ${{ fromJson(needs.params.outputs.config).steer_validate }}
          STEER_BOOST: ${{ fromJson(needs.params.outputs.config).steer_boost }}
          STEER_PLACEBO: ${{ fromJson(needs.params.outputs.config).steer_placebo }}
          NEURONPEDIA_STEER_STRENGTH: ${{ fromJson(needs.params.outputs.config).steer_strength }}
          NEURONPEDIA_STEER_BOOST_STRENGTH: ${{ fromJson(needs.params.outputs.config).steer_boost_strength }}
          NEURONPEDIA_STEER_RANK_OFFSET: ${{ fromJson(needs.params.outputs.config).steer_rank_offset }}
          MEDLANG_ANTHROPIC_MODEL: ${{ fromJson(needs.params.outputs.config).translation_model }}
          MEDLANG_TRANSLATION_PLACEBO: ${{ fromJson(needs.params.outputs.config).translation_placebo }}
          SOURCE_SET: ${{ fromJson(needs.params.outputs.config).source_set }}
        run: |
          ARGS=(ci_pairs.json
            --mode "${{ fromJson(needs.params.outputs.config).mode }}"
            --backend hosted
            --graph-model "${{ matrix.model }}"
            --max-n-logits "${{ fromJson(needs.params.outputs.config).max_n_logits }}"
            --desired-logit-prob "${{ fromJson(needs.params.outputs.config).desired_logit_prob }}"
            --node-threshold "${{ fromJson(needs.params.outputs.config).node_threshold }}"
            --edge-threshold "${{ fromJson(needs.params.outputs.config).edge_threshold }}"
            --max-feature-nodes "${{ fromJson(needs.params.outputs.config).max_feature_nodes }}"
            --start-index "$((OFFSET + 1))"
            --out "$OUT_DIR")
          if [ -n "$SCREEN" ]; then
            ARGS+=(--screen-targets "$SCREEN")
          fi
          # "" (the default) passes nothing, so the server applies the model's default graph source set
          if [ -n "$SOURCE_SET" ]; then
            ARGS+=(--source-set "$SOURCE_SET")
          fi
          if [ "$MITIGATE" = "true" ]; then
            ARGS+=(--show-mitigation)
          fi
          if [ -n "$GEN_EXPL" ] && [ "$GEN_EXPL" != "0" ]; then
            ARGS+=(--generate-missing-explanations "$GEN_EXPL")
          fi
          if [ -n "$STEER_VALIDATE" ] && [ "$STEER_VALIDATE" != "0" ]; then
            ARGS+=(--steer-validate "$STEER_VALIDATE")
          fi
          if [ -n "$STEER_BOOST" ] && [ "$STEER_BOOST" != "0" ]; then
            ARGS+=(--steer-boost "$STEER_BOOST")
          fi
          if [ -n "$STEER_PLACEBO" ] && [ "$STEER_PLACEBO" != "0" ]; then
            ARGS+=(--steer-placebo "$STEER_PLACEBO")
          fi
          # empty strength/offset overrides fall back to module defaults
          [ -z "$NEURONPEDIA_STEER_STRENGTH" ] && unset NEURONPEDIA_STEER_STRENGTH
          [ -z "$NEURONPEDIA_STEER_BOOST_STRENGTH" ] && unset NEURONPEDIA_STEER_BOOST_STRENGTH
          [ -z "$NEURONPEDIA_STEER_RANK_OFFSET" ] && unset NEURONPEDIA_STEER_RANK_OFFSET
          # empty translation_model falls back to llm_client.DEFAULT_MODEL
          [ -z "$MEDLANG_ANTHROPIC_MODEL" ] && unset MEDLANG_ANTHROPIC_MODEL
          # "0" keeps the real translation prompt; "1" swaps in the placebo rewrite
          [ "$MEDLANG_TRANSLATION_PLACEBO" = "0" ] && unset MEDLANG_TRANSLATION_PLACEBO
          medlang-batch-eval "${ARGS[@]}"

      # Pilot root only: pilot pairs come from the pilot generator, not the study's batches, so everything this cell
      # wrote and the pairs file it read are swept for sealed holdout phrases before anything is committed (the
      # petri_audit.yml pattern: no site checkout, the sealed set computed from data/ and ops/). Runs after a failed
      # trace too, as the commit step does, so a partial cell is checked before its checkpoint lands; the commit,
      # run-page summary and artifact-upload steps below act on a pilot cell only when this step succeeded.
      - name: Holdout seal check over the pilot trace outputs (pilot root only; fails closed)
        id: seal
        if: ${{ always() && fromJson(needs.params.outputs.config).output_root == 'pilot/traces' }}
        env:
          PAIRS_FILE: ${{ fromJson(needs.params.outputs.config).pairs_file }}
        run: |
          set -euo pipefail
          # seal_check.py reads a root that does not exist as zero files and passes, so a pairs file that is not
          # there fails here rather than letting the check pass over nothing (a comma in the name is refused at fire
          # time and in the params job for the same reason: --extra splits on commas)
          test -f "$PAIRS_FILE" || { echo "pilot seal check: pairs file $PAIRS_FILE not found"; exit 1; }
          python scripts/seal_check.py --site "$RUNNER_TEMP/no-site" --extra "$OUT_DIR,$PAIRS_FILE"

      - name: Commit trace outputs to the dispatched branch
        if: ${{ always() && fromJson(needs.params.outputs.config).commit_outputs == 'true' && (fromJson(needs.params.outputs.config).output_root != 'pilot/traces' || steps.seal.outcome == 'success') }}
        env:
          OFFSET: ${{ matrix.offset }}
          BRANCH: ${{ github.ref_name }}
          OUTPUT_ROOT: ${{ fromJson(needs.params.outputs.config).output_root }}
        run: |
          set -euo pipefail
          # Checkpoint whatever finished (the per-pair batch_summary.json
          # checkpointing means a timeout still leaves committed pairs). The
          # summary is renamed to a .part_NN file so chunks never clobber
          # each other; heavyweight *.tagged.json graphs stay artifact-only.
          START=$((OFFSET + 1))
          if [ -f "$OUT_DIR/batch_summary.json" ]; then
            mv "$OUT_DIR/batch_summary.json" "$OUT_DIR/batch_summary.part_$(printf '%02d' "$START").json"
          fi
          # The mitigation translation is the only paid call in a trace run.
          # Its sidecar was never committed (and before 2026-07-31 never even
          # written), so ledger_update booked $0 for every --show-mitigation
          # run. Same part_NN treatment as the summary so chunks never clobber.
          if [ -f "$OUT_DIR/mitigation.report.json" ]; then
            mv "$OUT_DIR/mitigation.report.json" "$OUT_DIR/mitigation.part_$(printf '%02d' "$START").report.json"
          fi
          shopt -s nullglob
          if [ "$OUTPUT_ROOT" = "pilot/traces" ]; then
            # a pilot trace commits its summary parts only; renders and tagged graphs stay in the workflow artifact
            FILES=("$OUT_DIR"/batch_summary.part_*.json)
          else
            FILES=("$OUT_DIR"/index_*.html "$OUT_DIR"/index_*.png "$OUT_DIR"/multi_*.html "$OUT_DIR"/multi_*.png "$OUT_DIR"/batch_summary.part_*.json "$OUT_DIR"/mitigation.part_*.report.json)
          fi
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No trace outputs to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse -f "${FILES[@]}"
          git commit -m "Trace outputs: $OUT_DIR pairs starting at ${START} (${{ matrix.model }}, ${{ fromJson(needs.params.outputs.config).mode }})"
          PUSHED=0
          for i in 1 2 3 4 5; do
            # -X theirs + abort guard: same conflict seam as the jlens chunk-3
            # loss (2026-07-15); the run's own outputs win, unique part names
            # never conflict.
            if git pull --rebase -X theirs origin "$BRANCH" && git push origin HEAD:"refs/heads/$BRANCH"; then
              PUSHED=1
              break
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 2))
          done
          [ "$PUSHED" -eq 1 ]

      # Under the pilot root the run page and the artifact are publications too (an artifact cannot be retracted once
      # created), so a pilot cell whose seal check did not succeed publishes neither; the default root is unchanged.
      - name: Publish summary to run page
        if: ${{ always() && (fromJson(needs.params.outputs.config).output_root != 'pilot/traces' || steps.seal.outcome == 'success') }}
        env:
          OFFSET: ${{ matrix.offset }}
          MODEL: ${{ matrix.model }}
          MODE: ${{ fromJson(needs.params.outputs.config).mode }}
        run: |
          # This cell's own summary, named rather than listed: batch_summary.json until the commit step renames it
          # batch_summary.part_NN.json (NN = OFFSET + 1, as there). The checkout leaves both roots' output directories
          # out, so OUT_DIR should hold no other cell's part; naming this cell's keeps any other part from appearing
          # under this cell's heading.
          PART="$OUT_DIR/batch_summary.part_$(printf '%02d' "$((OFFSET + 1))").json"
          SUMMARY=""
          if [ -f "$OUT_DIR/batch_summary.json" ]; then
            SUMMARY="$OUT_DIR/batch_summary.json"
          elif [ -f "$PART" ]; then
            SUMMARY="$PART"
          fi
          if [ -n "$SUMMARY" ]; then
            {
              echo "## Circuit trace batch summary ($MODEL, $MODE, offset $OFFSET)"
              echo '```json'
              cat "$SUMMARY"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload trace outputs
        if: ${{ always() && (fromJson(needs.params.outputs.config).output_root != 'pilot/traces' || steps.seal.outcome == 'success') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: circuit-trace-${{ matrix.model }}-${{ fromJson(needs.params.outputs.config).mode }}-${{ github.run_number }}-offset${{ matrix.offset }}
          # just this cell's dir - uploading all of trace_out/ ships the whole
          # (hundreds of MB) archive from every matrix cell
          path: ${{ env.OUT_DIR }}
          if-no-files-found: warn
