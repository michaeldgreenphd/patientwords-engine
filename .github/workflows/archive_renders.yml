name: Archive Renders to Release (medlang-circuits)

# Packages the FULL render set for one or more trace runs into a zip and
# attaches it to a GitHub Release on this (public) engine repo. The public
# site keeps only the capped demonstration set (see
# export_frontend_simulated.py --max-renders); this is the durable back-end
# copy of everything, kept off the site repo and - optionally - off the
# engine's git working tree.
#
# Two ways to start it (same pattern as the trace workflow):
#   - workflow_dispatch from the Actions tab; or
#   - push a parameters file to .github/trigger/archive-renders.json, e.g.
#       {"tag":"renders-20260707",
#        "runs":["trace_out/dialects_20260707T000923Z",
#                "trace_out/pairs_20260706T201750Z"],
#        "no_pngs": false, "prune": false}
#
# A manifest is committed to render_archives/<tag>.manifest.json so the repo
# keeps an index of what was archived and where to download it (with the
# member list, so scripts/render_archive.py can fetch one PNG back without
# reading the zip); the zip itself is never committed.
#
# prune_only (2026-09-08): no bundle, no upload. Every PNG of the listed runs
# must already be in a Release (scripts/render_archive.py coverage
# --require-archived checks by member name, reading the zips' central
# directories over HTTP); then the PNGs are removed from the index and the
# deletion committed. This is how the 2026-09 prune of PNGs that the July
# Releases already held was done without re-uploading them. The checkout is
# blobless and sparse, so a run's renders are fetched only when a bundle is
# built: the full tree (roughly 23 GB of renders at HEAD in 2026-09) no
# longer fits a runner.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag / bundle name, e.g. renders-20260707"
        type: string
        required: true
      runs:
        description: "Comma- or space-separated trace_out/<run> directories to bundle"
        type: string
        required: true
      no_pngs:
        description: "Drop the multi-MB PNGs from the bundle (keep interactive HTML + summaries)"
        type: boolean
        default: false
      prune:
        description: "After a successful upload, git-rm the archived runs' index_*.png and multi_*.png from this branch (HTML stays; full-res PNGs live in the Release)"
        type: boolean
        default: false
      prune_only:
        description: "No bundle or upload: verify every PNG of the runs is already in a Release, then git-rm them"
        type: boolean
        default: false
      allow_shrink:
        description: "Let the upload replace an asset with a bundle holding fewer PNGs than the branch's manifest records (normally refused)"
        type: boolean
        default: false
  push:
    paths:
      - ".github/trigger/archive-renders.json"

permissions:
  contents: write

concurrency:
  group: archive-renders-${{ github.ref }}
  cancel-in-progress: false

jobs:
  archive:
    # A push that creates a ref carries created:true, and on a new ref every
    # trigger file counts as changed (2026-09-04: a merge branch fired all eight
    # lanes at once). Skip on creation; fires are pushes to existing branches.
    if: ${{ !github.event.created }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          filter: blob:none
          sparse-checkout: |
            .github
            scripts
            render_archives

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Resolve parameters
        id: params
        env:
          EVENT_NAME: ${{ github.event_name }}
          IN_TAG: ${{ inputs.tag }}
          IN_RUNS: ${{ inputs.runs }}
          IN_NO_PNGS: ${{ inputs.no_pngs }}
          IN_PRUNE: ${{ inputs.prune }}
          IN_PRUNE_ONLY: ${{ inputs.prune_only }}
          IN_ALLOW_SHRINK: ${{ inputs.allow_shrink }}
        run: |
          python - <<'EOF'
          import json, os

          def as_bool(value, key):
              # Only a JSON boolean or the strings "true"/"false" (the park
              # defaults use strings). bool("false") is True, which on the
              # allow_shrink key would skip the destructive-upload guard
              # (Codex, PR #15); anything else is a refusal, not a default.
              if isinstance(value, bool):
                  return value
              if isinstance(value, str) and value.strip().lower() in ("true", "false"):
                  return value.strip().lower() == "true"
              raise SystemExit(f"{key} must be true or false (JSON boolean or string), got {value!r}")

          if os.environ["EVENT_NAME"] == "push":
              with open(".github/trigger/archive-renders.json", encoding="utf-8") as f:
                  cfg = json.load(f)
              tag = str(cfg["tag"])
              runs = cfg["runs"]
              if isinstance(runs, str):
                  runs = runs.replace(",", " ").split()
              no_pngs = as_bool(cfg.get("no_pngs", False), "no_pngs")
              prune = as_bool(cfg.get("prune", False), "prune")
              prune_only = as_bool(cfg.get("prune_only", False), "prune_only")
              allow_shrink = as_bool(cfg.get("allow_shrink", False), "allow_shrink")
          else:
              tag = os.environ["IN_TAG"]
              runs = os.environ["IN_RUNS"].replace(",", " ").split()
              no_pngs = os.environ.get("IN_NO_PNGS", "") == "true"
              prune = os.environ.get("IN_PRUNE", "") == "true"
              prune_only = os.environ.get("IN_PRUNE_ONLY", "") == "true"
              allow_shrink = os.environ.get("IN_ALLOW_SHRINK", "") == "true"
          if not tag or not runs:
              raise SystemExit("archive-renders needs a tag and at least one run")
          if no_pngs and prune:
              # F-H01 (audit 1, 2026-07-17): pruning PNGs that the bundle
              # excluded would leave them neither on the branch tip nor in the
              # Release; refuse before any bundle or upload work happens.
              raise SystemExit("prune=true with no_pngs=true would delete PNGs "
                               "that are not in the Release; refuse")
          if prune_only and (prune or no_pngs):
              raise SystemExit("prune_only stands alone: it neither bundles nor uploads")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"tag={tag}\n")
              out.write("runs=" + " ".join(runs) + "\n")
              out.write(f"no_pngs={'1' if no_pngs else '0'}\n")
              out.write(f"prune={'1' if prune else '0'}\n")
              out.write(f"prune_only={'1' if prune_only else '0'}\n")
              out.write(f"allow_shrink={'1' if allow_shrink else '0'}\n")
          print("tag:", tag)
          print("runs:", runs)
          print("no_pngs:", no_pngs, "prune:", prune, "prune_only:", prune_only)
          EOF

      - name: Verify every PNG of the runs is already in a Release (prune_only)
        if: steps.params.outputs.prune_only == '1'
        env:
          RUNS: ${{ steps.params.outputs.runs }}
        run: |
          set -euo pipefail
          python scripts/render_archive.py coverage --runs $RUNS --require-archived

      - name: Materialize the runs' renders (bundle path only)
        if: steps.params.outputs.prune_only != '1'
        env:
          RUNS: ${{ steps.params.outputs.runs }}
        run: |
          set -euo pipefail
          # Blobless sparse checkout: only these runs' renders come down.
          git sparse-checkout add $RUNS
          git checkout -- .

      - name: Build render bundle
        if: steps.params.outputs.prune_only != '1'
        env:
          TAG: ${{ steps.params.outputs.tag }}
          RUNS: ${{ steps.params.outputs.runs }}
          NO_PNGS: ${{ steps.params.outputs.no_pngs }}
        run: |
          set -euo pipefail
          ARGS=(--runs $RUNS --tag "$TAG" --out-dir dist)
          if [ "$NO_PNGS" = "1" ]; then ARGS+=(--no-pngs); fi
          python scripts/archive_run.py "${ARGS[@]}"

      - name: Refuse a bundle that would shrink what the Release holds
        if: steps.params.outputs.prune_only != '1' && steps.params.outputs.allow_shrink != '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.params.outputs.tag }}
        run: |
          set -euo pipefail
          # 2026-09-08: a duplicate fire after the prune rebuilt an HTML-only
          # bundle and --clobber'd the asset that held the PNGs. Compare the
          # new manifest with the one on the branch before anything is uploaded.
          # A missing branch manifest is not proof of a first upload: the
          # asset is uploaded before the manifest is committed, so a failed
          # commit (run 34277465050 did exactly that) leaves a Release with no
          # manifest. An existing Release with no manifest is refused outright.
          MANIFEST="render_archives/${TAG}.manifest.json"
          if [ ! -f "$MANIFEST" ] && gh release view "$TAG" >/dev/null 2>&1; then
            echo "refused: Release $TAG already exists but $MANIFEST is not on this branch;" \
                 "its contents cannot be compared. Pass allow_shrink to replace it on purpose." >&2
            exit 1
          fi
          if [ -f "$MANIFEST" ]; then
            # The manifest on this branch may be older than the live asset (a
            # same-tag fire queued before the previous run's commit landed, or
            # an upload whose commit failed). Compare against the asset itself:
            # download it and check its sha256 against what the manifest
            # records; a mismatch means the manifest does not describe what
            # --clobber would destroy, so refuse.
            ZIPNAME=$(python -c "import json; print(json.load(open('$MANIFEST'))['zip_name'])")
            EXPECTED=$(python -c "import json; print(json.load(open('$MANIFEST'))['zip_sha256'])")
            mkdir -p live_asset
            gh release download "$TAG" --pattern "$ZIPNAME" --dir live_asset --clobber
            ACTUAL=$(sha256sum "live_asset/$ZIPNAME" | cut -d' ' -f1)
            rm -rf live_asset
            if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "refused: the live asset of $TAG (sha256 $ACTUAL) is not the one $MANIFEST records ($EXPECTED);" \
                   "the manifest is stale, so the shrink check cannot be trusted. Refresh the manifest first." >&2
              exit 1
            fi
          fi
          python scripts/render_archive.py shrink-check --new "dist/${TAG}.manifest.json" --old "$MANIFEST"

      - name: Upload bundle to a GitHub Release
        if: steps.params.outputs.prune_only != '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.params.outputs.tag }}
        run: |
          set -euo pipefail
          ZIP="dist/${TAG}.zip"
          NOTES="Full circuit-render bundle for the runs in render_archives/${TAG}.manifest.json. The public site carries only the capped demonstration set."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
          else
            gh release create "$TAG" "$ZIP" --title "Renders: $TAG" --notes "$NOTES"
          fi
          URL=$(gh release view "$TAG" --json url -q .url)
          echo "RELEASE_URL=$URL" >> "$GITHUB_ENV"
          echo "Uploaded $ZIP to $URL"

      - name: Record manifest + optional prune, commit to branch
        env:
          TAG: ${{ steps.params.outputs.tag }}
          RUNS: ${{ steps.params.outputs.runs }}
          PRUNE: ${{ steps.params.outputs.prune }}
          PRUNE_ONLY: ${{ steps.params.outputs.prune_only }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$PRUNE_ONLY" != "1" ]; then
            mkdir -p render_archives
            # Stamp the Release URL into the committed manifest.
            python - <<'EOF'
          import json, os
          tag = os.environ["TAG"]
          src = f"dist/{tag}.manifest.json"
          with open(src, encoding="utf-8") as f:
              m = json.load(f)
          m["release_url"] = os.environ.get("RELEASE_URL")
          with open(f"render_archives/{tag}.manifest.json", "w", encoding="utf-8") as f:
              f.write(json.dumps(m, indent=2) + "\n")
          print("manifest ->", f"render_archives/{tag}.manifest.json")
          EOF
            git add "render_archives/${TAG}.manifest.json"
          fi

          if [ "$PRUNE" = "1" ] || [ "$PRUNE_ONLY" = "1" ]; then
            # The full-res PNGs live in a Release (this fire's, or an earlier
            # one that the verify step confirmed by member name); drop them
            # from the index so fresh clones stay lean. Interactive HTML and
            # summaries stay in git. --sparse --cached: the paths need not be
            # materialized, which on the prune_only path they are not.
            for run in $RUNS; do
              git ls-tree -r --name-only HEAD -- "$run" \
                | grep -E "/(index|multi)_[^/]*\.png$" \
                | xargs -r -d '\n' git rm -q --sparse --cached --ignore-unmatch --
            done
          fi

          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          if [ "$PRUNE_ONLY" = "1" ]; then
            MSG="Prune renders: $TAG (PNGs already in Releases, removed from branch)"
          else
            MSG="Archive renders: $TAG -> Release"
            if [ "$PRUNE" = "1" ]; then MSG="$MSG (PNGs pruned from branch)"; fi
          fi
          git commit -m "$MSG"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin "$BRANCH" && git push origin HEAD:"refs/heads/$BRANCH"; then
              exit 0
            fi
            sleep $((i * 2))
          done
          exit 1

      - name: Job summary
        if: always()
        env:
          TAG: ${{ steps.params.outputs.tag }}
        run: |
          {
            echo "## Render archive: $TAG"
            if [ -f "render_archives/${TAG}.manifest.json" ]; then
              echo '```json'
              cat "render_archives/${TAG}.manifest.json"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
