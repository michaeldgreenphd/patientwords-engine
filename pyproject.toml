[tool.poetry]
name = "medlang-circuits"
version = "0.1.0"
description = "Pipeline for comparing attribution graphs of clinical vs. colloquial patient medical language (gemma-2-2b + Gemma Scope transcoders)."
authors = ["Michael D. Green"]
license = "MIT"
readme = "README.md"
packages = [{ include = "medlang_circuits" }]

[tool.poetry.dependencies]
python = "^3.10"
requests = "^2.31.0"
matplotlib = "^3.8.0"
networkx = "^3.2"
anthropic = { version = ">=0.40.0", optional = true }
openpyxl = { version = "^3.1", optional = true }

[tool.poetry.extras]
llm = ["anthropic"]
sheets = ["openpyxl"]

[tool.poetry.group.dev.dependencies]
# Pinned to the minor versions the suite and lint last passed on (pytest 9.1.1,
# ruff 0.16.9, pyyaml 6.0.3, 2026-09-30); a ruff bump can add findings, so
# widen these on purpose, not by accident.
pytest = "~9.1"
ruff = "~0.16"
# tests/ parses the workflow YAML with pyyaml; nothing under medlang_circuits/ does,
# so it is a dev dependency, not a runtime one.
pyyaml = "^6.0"

[tool.poetry.scripts]
medlang-compare = "medlang_circuits.cli:main"
medlang-batch-eval = "medlang_circuits.batch_eval:main"
medlang-evaluate = "medlang_circuits.evaluate_models:main"
medlang-generate = "medlang_circuits.scenario_gen:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
# Import the checkout's own packages (medlang_circuits, scripts) ahead of any
# installed copy, so the bare `pytest` command tests this tree, as
# `python -m pytest` already does.
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

